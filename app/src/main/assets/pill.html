<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bubble</title>
<link rel="stylesheet" href="dna.css">
<style>
  :root {
    --pill-background: rgba(0, 0, 0, 1);
    /* The same colour split in two, for the liquid skin: its shapes have to be solid
       to survive the metaball's contrast, so the transparency is worn by the layer
       they sit in rather than by each of them. Written by setPillBackground. */
    --pill-solid: rgb(0, 0, 0);
    --pill-alpha: 1;
    --pill-width: 130px;
    --pill-height: 34px;
    /* Repointed per notification by the app style table in Kotlin; the bubble never
       names an app colour itself. Plain white when nothing has repointed it: the
       section colour underneath is the phone's own accent, and a notification from an
       app with no colour of its own borrowing it read as a colour that meant
       something — most visibly on the way out, where the accent is dropped while the
       alert is still on screen and the text went green as it left. */
    --app-accent: #ffffff;
    --camera: #f09b3a;
    /* A link's blue, bright enough to survive on the bubble's black rather than the
       browser default nobody can read on it. */
    --link: #6fb3ff;
    /* The camera hole plus the daylight either side of it. Everything here is centred
       on the screen and so is the hole, so the middle of any grown state is the one
       place text must never be written — it is not covered by the bubble once the
       bubble is wider than the hole. Reserved rather than avoided: the two halves of
       a head row stop at this corridor and neither may borrow from it. */
    --hole-gap: 40px;
    /* The alert's own corner, and how far the head row sits inside it. Anything given
       a ground of its own in there is rounded by the difference, so its corners are
       concentric with the bubble's rather than a second, unrelated curve. Mirrors
       CORNERS.alert and #alert-face's padding. */
    --alert-radius: 24px;
    --alert-inset: 14px;
    /* The panel's enter curve overshoots by ~56%, which on a 34px-tall bubble
       reads as a bounce and flattens the corners on the way. A fifth of that is
       enough to feel alive at this size. */
    --ease-grow: cubic-bezier(0.22, 1.12, 0.36, 1);
    /* What a closed mod is allowed to take: a little width, and no height at all.
       Its content is measured off the bubble it lives in, so a smaller bubble gets
       a smaller glyph rather than a taller pill. */
    --mod-width: 56px;
    /* An alert is a glance and can arrive quickly; opening something the finger
       asked for is a bigger move over a longer distance, and at 340ms it reads as
       a jump rather than a growth. */
    --grow-ms: 340ms;
    --mod-glyph: calc(var(--pill-height) - 10px);
    /* How far the glyph's place in the bare bubble is from the middle of it, which
       is where an arriving mod comes up out of. Written from the same three numbers
       the layout is: half the bare width, less the inset every glyph carries, less
       half the glyph itself. */
    --glyph-inset: calc((var(--pill-height) - var(--mod-glyph)) / 2 - 1px);
    --enter-from: calc(
      var(--main-width) / 2 - var(--glyph-inset) - var(--mod-glyph) / 2
    );
    /* The width the main bubble is actually drawing right now, written from JS
       because the satellites are positioned off its edges and CSS cannot work out
       which mod owns it. */
    --main-width: var(--pill-width);
    --sat-gap: 6px;
    /* A split is the one motion that should overshoot properly: it is meant to read
       as liquid letting go, not as a box growing. */
    --ease-split: cubic-bezier(0.2, 1.7, 0.35, 1);
  }

  html, body {
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  /* Every text run in the bubble clips itself — that is how the ellipsis and the
     line clamp work — and the DNA rounds every box by default. A radius on a box
     that clips its own text bites the corners off the first and last glyphs, which
     is invisible until a letter lands there. Text is not a box: it never rounds.
     The DNA already says so for spans and headings; these are the divs it cannot
     know about. */
  #text, #app-name, #title, #unread,
  #player-title, #player-artist, #player-position, #player-duration,
  #history-label, #history-count, #history-empty, .history-name, .history-text,
  #quick-label, #microphone-state,
  #timer-remaining, #timer-label, #timer-clock {
    border-radius: 0;
  }

  /* Centred by auto margins rather than a translate, so `transform` stays free for
     the hold gesture. A transform that also carries the centring turns every host
     window relayout into a visible slide. */
  #pill {
    position: absolute;
    /* The window carries an invisible grab margin all round, so the bubble sits one
       margin in from its top edge — otherwise it would ride that much too high. */
    top: var(--grab, 0px);
    left: 0;
    right: 0;
    margin-inline: auto;
    width: var(--pill-width);
    height: var(--pill-height);
    /* Half the height, never 999px: a radius animating down from 999 stays clamped
       to half the height for most of the travel and then squares off all at once.
       Real values in, real values out, and the corners follow the size. */
    border-radius: calc(var(--pill-height) / 2);
    background: var(--pill-background);
    border: 1px solid var(--border);
    contain: layout paint;
    will-change: width, height;
    transition:
      /* The width is the one dimension a closed mod moves, and it is moving because
         something split off the bubble or ran back into it — so it rides the split's
         own curve and its own delay rather than the growth's. Opening still grows on
         --ease-grow: those are the defaults these two carry. */
      width var(--width-ms, var(--grow-ms)) var(--width-ease, var(--ease-grow))
        var(--width-delay, 0ms),
      height var(--grow-ms) var(--ease-grow),
      /* Same length as the size it belongs to, but never springy: an
         overshooting radius undershoots and the corners snap square. */
      border-radius var(--grow-ms) ease-out,
      top var(--grow-ms) var(--ease-grow),
      /* Late, so the two moves read in order: the bubble pulls its width in, and
         only once it is narrower does it step aside for what is arriving. */
      translate var(--shift-ms, var(--grow-ms)) var(--ease-grow) var(--shift-delay, 0ms),
      transform 350ms linear,
      border-color 220ms ease;
    transform-origin: 50% 0;
    /* The window grows on the side the satellite is on, so its centre is no longer
       the screen's. This pulls the bubble back onto the cutout — written as
       `translate` rather than `transform`, which the hold's scale owns. */
    translate: var(--shift, 0px) 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  /* ponytail: width/height transition on one contained element. If the S25
     ever shows jank here, swap to transform scale + counter-scaled content. */

  /* The bubble is always on the glass. Only its contents come and go. */
  #pill.alert { border-color: var(--app-accent); }
  /* A notification only needs room for two lines of copy, not the full sheet. */
  /* An alert shares its top edge with the resting bubble — the same line the cutout
     sits on — and takes all its extra size downwards, so nothing about where it
     begins changes when one arrives. */
  #pill.alerting {
    width: 300px;
    height: 108px;
    border-radius: 24px;
    /* Level with the closed bubble, and grows downwards from it. It used to start
       higher up and settle back, which read as the alert arriving out of place. */
    top: var(--grab, 0px);
  }
  #pill.alerting.with-image { height: 152px; }
  #pill.expanded { width: 340px; height: 150px; border-radius: 30px; }
  #pill.picture { width: 340px; height: var(--picture-height, 320px); border-radius: 26px; }
  #pill.history { width: 340px; height: var(--history-height, 320px); border-radius: 26px; }

  /* The bubble taking something in. Written as `scale` rather than as a transform,
     because the transform is the hold's and the translate is the row's place: one
     property, one owner. Under the goo layer this reads as the row swallowing the
     circle rather than as a box changing size, which is the whole reason it is a
     squash and a stretch and not a fade. */
  #pill.knocked { animation: pill-knock 460ms var(--ease-grow); }
  @keyframes pill-knock {
    0% { scale: 1 1; }
    30% { scale: 1.05 0.93; }
    62% { scale: 0.985 1.03; }
    100% { scale: 1 1; }
  }

  /* Everything the closed bubble is: the bubble and whatever has split off it — a
     plain container, so the satellites sit in the bubble's coordinate space. */
  #assembly { position: absolute; inset: 0; }

  /* #region ── liquid ────────────────────────────────────────────────────── */

  /* The skin of the closed row, drawn apart from what it contains. The bubble and
     its satellites are separate boxes and cannot merge; two solid shapes under one
     metaball filter can, so the row's *fill* is drawn here and the boxes above are
     left to carry nothing but their content.
     Only the closed row: a single grown panel has nothing to merge with, so it goes
     on drawing its own background and the filter is switched off entirely — the
     cheapest filter is the one that is not running.
     The blur is deliberately small. Two shapes bridge at about twice its deviation,
     and the satellites rest six pixels off the bubble: at 2 they are separate
     circles standing still and only fuse in the last few pixels of a split, which is
     the moment worth drawing. A wider blur would weld the row together for good. */
  #liquid {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    /* Only as tall as the row can ever be, hold included: a filter costs its region,
       and the region is the one thing here that is free to be small. */
    height: calc(var(--grab, 0px) + var(--liquid-tall, calc(var(--pill-height) * 1.2 + 16px)));
    display: none;
    pointer-events: none;
  }
  html.liquid #liquid { display: block; }
  /* The bubble stops painting itself the moment the skin does it instead. Every bubble
     on the row is in this rule, the Now bubble included: it was left out and went on
     painting its own opaque edge on top of the skin, which is why the one bubble whose
     background came from the same custom property as everyone else's still read as a
     different alpha — the rim was solid where the others were glass. */
  html.liquid #pill, html.liquid .satellite, html.liquid #now {
    background: transparent;
    border-color: transparent;
  }

  #liquid-edge, #liquid-fill { position: absolute; inset: 0; filter: url(#bubble-goo); }
  /* The hairline, as a shape a pixel bigger all round rather than as a border: a
     one-pixel line is thinner than the blur and would be wiped out by it, while a
     shape underneath survives the same filter the fill does and merges with it. */
  /* Its colour is read off the box it stands for rather than named again here, so an
     alert's accent border arrives in the skin without a second rule to keep in step. */
  #liquid-edge .blob { background: var(--border); }
  #liquid-fill .blob { background: var(--pill-solid, #000); }
  /* The colour is solid inside the filter and the layer wears the transparency: a
     half-transparent shape is below the contrast's threshold and is erased instead
     of merged, which would take the bubble off screen entirely. */
  #liquid-fill { opacity: var(--pill-alpha, 1); }

  .blob {
    position: absolute;
    top: 0;
    left: 0;
    will-change: transform, width, height;
  }

  /* #endregion ───────────────────────────────────────────────────────────── */

  /* The hold gesture: the bubble grows under the finger until it opens, so the
     pressure is visible before the haptic confirms it. Grown from its own top edge:
     scaling from the middle would push it above the window, where the status bar
     clips it. Only the bubble grows — a satellite is not the thing being held, and
     scaling the pair moved something the finger was never on. */
  html.holding #pill { transform: scale(var(--hold-scale, 1.14)); }

  /* The pull down, live under the finger: the bubble leans out of the cutout by the
     grab margin and no further, and springs back on its own transform transition if
     the finger lets go before it has asked for anything. Nothing eases while the
     finger is down — a pull that lags behind the finger reads as a stutter. */
  html.pulling #pill {
    transform: translateY(var(--pull, 0px)) scale(var(--pull-scale, 1));
    transition: none;
  }

  /* Both at once, which is the normal case now that a lean no longer calls the hold
     off: the bubble is still swelling under the finger while it leans out. */
  html.holding.pulling #pill {
    transform:
      translateY(var(--pull, 0px))
      scale(calc(var(--hold-scale, 1.14) * var(--pull-scale, 1)));
  }

  /* The same gesture on an open mod, which cannot grow anything like as far: the
     window is already the open bubble and only the grab margin is spare, so this is
     just enough pressure to say the hold has been noticed. */
  html.pressing #pill { transform: scale(1.03); }

  .face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0 0.75rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease;
  }
  .face.showing { opacity: 1; pointer-events: auto; }

  /* A mod's face rises into the bubble from underneath it — but only the part of it
     that actually changes. Every mod carries a glyph in the same place at the left,
     so animating that too would move something that is already on screen and already
     correct; it is swapped outright and the reading beside it is what travels. Only
     the arriving face moves: the one it replaces is already being cut off by the
     width the bubble is giving up, and animating that out as well drew both of them
     in the same bubble at once. Slow on purpose — this is the one moment the bubble
     is read rather than glanced at. */
  /* Normally nothing: the glyph is swapped outright, because it is already in the
     right place. The exception is a mod being absorbed back into the bubble, where
     the face is genuinely new and must not appear until the circle carrying it has
     arrived — that is what --face-fade and --face-delay are, and they are zero
     every other time, which is the swap this rule started as. */
  #media-face, #timer-face, #call-face {
    transition: opacity var(--face-fade, 0ms) ease var(--face-delay, 0ms);
  }
  #equalizer, #timer-remaining, #call-name, #call-time,
  #battery-reading {
    transition: opacity 380ms ease, transform 560ms cubic-bezier(0.16, 0.8, 0.3, 1);
    transition-delay: var(--face-delay, 0ms);
  }
  .face:not(.showing) #equalizer, .face:not(.showing) #timer-remaining,
  .face:not(.showing) #call-name, .face:not(.showing) #call-time,
  .face:not(.showing) #battery-reading {
    opacity: 0;
    transform: translateY(30px);
    transition: none;
  }

  /* #region ── the glyph, arriving ───────────────────────────────────────── */

  /* Every mod carries one glyph at the left of the bubble, and it is the same
     object wherever the mod happens to be: in the bubble, or in the circle that
     split off it. That is what makes the row readable — nothing is redrawn
     somewhere else, things travel.
     A mod taking the bubble therefore arrives as its glyph and not as a box: it
     comes up out of the middle, small enough to sit inside the camera hole rather
     than across it, lands on the left with the split's own overshoot, and the
     bubble opens out only because something turned up at its edge. */
  .glyph.entering { animation: glyph-enter var(--enter-ms, 300ms) var(--ease-split); }
  /* The arrival of a mod pulled in off a swipe, from either side, and it cannot be the
     entrance above. That one starts from the middle of the bubble; this glyph is
     already on screen — it is in the circle that just became this bubble — so an
     entrance would first teleport it somewhere it never was and then move it. What it
     takes instead is the knock of the arrival: a shove from where it stands, carrying
     on the way the row was travelling, and back. No fade either, because it never went
     anywhere. The sign is the direction it came from: pulled in from the left it is
     knocked right, pulled in from the right it is knocked left. */
  .glyph.bumping { animation: glyph-bump var(--enter-ms, 300ms) var(--ease-grow); }
  @keyframes glyph-bump {
    0% { transform: translateX(0); }
    30% { transform: translateX(var(--bump, 14px)); }
    100% { transform: translateX(0); }
  }
  @keyframes glyph-enter {
    from {
      transform: translateX(var(--enter-from)) scale(0.66);
      opacity: 0;
    }
    35% { opacity: 1; }
    to { transform: translateX(0) scale(1); opacity: 1; }
  }

  /* While the glyph is still on its way in, the bubble is the bare closed bubble
     and carries nothing else: the reading belongs to the width that has not been
     asked for yet. */
  html.entering .face.showing > :not(.glyph) { opacity: 0; transition: none; }

  /* The hand-over at the end of a merge. The circle and the bubble are holding the
     same glyph in the same place, so the bubble's own copy waits until the circle
     is gone — visibility rather than opacity, because there is nothing to animate
     here: it is one picture, and only which element draws it changes. */
  html.handing-over .face.showing > .glyph { visibility: hidden; }

  /* #endregion ───────────────────────────────────────────────────────────── */

  /* #region ── idle face ─────────────────────────────────────────────────── */

  /* Closed carries nothing but the unread count. The bubble's own shape is the
     affordance; a mark inside it only says the same thing twice. */
  #idle-face { gap: 0.5rem; }

  #unread {
    position: absolute;
    left: 0.7rem;
    font-size: 0.6rem;
    letter-spacing: 0.08rem;
    /* Pale grey: a count is a fact, not an alarm — the accent is spent on the app. */
    color: var(--text-muted);
    display: none;
  }
  #unread.present { display: block; }

  /* #endregion ───────────────────────────────────────────────────────────── */
  /* #region ── notification face ─────────────────────────────────────────── */

  /* Read from the top down, not floated in the middle: the head row is the first
     thing the eye lands on and it belongs on the bubble's own top line, where the
     closed bubble's content sits. Centring it pushed the app name a third of the way
     down the alert and left the growth looking like it had happened above the text. */
  #alert-face {
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    gap: 0.4rem;
    padding: 0.62rem 0.95rem;
  }
  #pill.expanded #alert-face, #pill.picture #alert-face { gap: 0.6rem; padding: 0.9rem 1.1rem; }
  #pill.picture #alert-face { justify-content: flex-start; }

  #alert-head {
    display: flex;
    align-items: center;
    /* The corridor down the middle of the head row, not a decorative gap: the alert
       is centred on the screen and so is the camera hole, which puts the hole exactly
       between these two runs of text. Anything written here is written under it. Both
       halves stop short of it instead, which is also what makes the row read as two
       columns rather than as one sentence that happens to have a space in it. */
    gap: var(--hole-gap);
    min-width: 0;
    flex: none;
  }

  /* Who it is from, on a ground of its own. The icon and the app's name are the two
     things the eye goes to first and they were sitting directly on the bubble's own
     black, which at this size makes them read as part of the message rather than as
     the label on it. A ground one step lighter sets them apart without drawing a box
     around them.

     The radius is the bubble's own, less how far in this sits: concentric corners run
     at the same rate and read as one shape, while a nested box that keeps the outer
     radius looks progressively squarer the further in it goes. */
  #alert-app {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    min-width: 0;
    flex: 1 1 50%;
    max-width: 50%;
    background: var(--raised);
    border-radius: calc(var(--alert-radius) - var(--alert-inset));
    padding: 0.15rem 0.45rem;
    box-sizing: border-box;
  }

  #icon {
    width: 18px;
    height: 18px;
    border-radius: 999px;
    flex: none;
    display: none;
    transition: width 340ms var(--ease-grow), height 340ms var(--ease-grow);
  }
  #icon.present { display: block; }
  #pill.expanded #icon, #pill.picture #icon { width: 24px; height: 24px; }

  /* Identity mode: 0 icon only, 1 name only, 2 both. */
  #pill[data-identity="1"] #icon { display: none; }
  #pill[data-identity="0"] #app-name { display: none; }

  /* Never an ellipsis. Text that does not fit fades out at the edge it runs off:
     three dots are a mark the writer did not put there, and they read as part of the
     message. A fade says "there is more" without saying anything. The mask runs in
     whichever direction the text actually overflows, which is the opposite of the
     edge it is aligned to. */
  #app-name, #title {
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
  }
  #app-name {
    font-size: 0.63rem;
    letter-spacing: 0.19rem;
    text-transform: uppercase;
    color: var(--app-accent);
    flex: 0 1 auto;
    mask-image: linear-gradient(90deg, #000 calc(100% - 1.4rem), transparent);
  }
  /* The sender sits hard right of the head row, opposite whatever names the app.
     Half the row each, and neither can take the other's: the sender used to be given
     whatever the app name did not want, so a long name pushed it across the middle
     and out the far side — the two ran into each other over the camera hole instead
     of standing on their own halves of the row. */
  #title {
    text-align: right;
    font-size: 0.68rem;
    letter-spacing: 0.04rem;
    color: var(--text-muted);
    flex: 1 1 50%;
    max-width: 50%;
    /* Right-aligned, so an over-long name hangs off the *left* edge and fades there. */
    mask-image: linear-gradient(90deg, transparent, #000 1.4rem);
  }
  /* A message is meant to be read, not sampled: it wraps and takes the lines it
     needs, and the alert is tall enough to hold three of them. */
  #text {
    min-width: 0;
    font-size: 0.72rem;
    line-height: 1.35;
    color: var(--text);
    flex: none;
    white-space: normal;
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
  }
  #pill.expanded #text { -webkit-line-clamp: 5; }

  /* A link is blue and underlined wherever it is, and that is the whole reason to do
     it here too: it is the one piece of styling a reader already knows the meaning
     of without being taught it. */
  .link {
    color: var(--link);
    text-decoration: underline;
    text-underline-offset: 0.15em;
    border-radius: 0;
  }
  /* What kind of message this is, in the app's own colour — the same colour already
     naming the app two lines above, so the eye reads them as one thing said twice
     rather than as a new kind of highlight. */
  .keyword {
    color: var(--app-accent);
    border-radius: 0;
  }
  #pill.picture #text { display: none; }

  /* A photo message is the message: the picture is rendered in the alert itself,
     cropped to a strip, and opens to its own aspect ratio when tapped. */
  #picture {
    display: none;
    width: 100%;
    border-radius: 0.75rem;
    object-fit: cover;
    flex: 1 1 auto;
    min-height: 0;
  }
  #pill.with-image #picture { display: block; }
  #pill.picture #picture { object-fit: contain; }

  /* #endregion ───────────────────────────────────────────────────────────── */
  /* #region ── media ─────────────────────────────────────────────────────── */

  /* Music is not an event: while something plays, this is what resting looks like.
     A little wider than the bare bubble, art on one side, life on the other — and
     exactly as tall, because a closed bubble that grows downwards stops reading as
     the same object. The content is sized off the height it has, not the other way
     round. */
  #pill.playing {
    width: var(--main-width);
    height: var(--pill-height);
  }
  #pill.player { width: 340px; height: 190px; border-radius: 26px; }
  /* The states a tap opens: slower, and the face fades in over the growth rather
     than racing it. */
  #pill.player, #pill.timer,
  #pill.history, #pill.expanded, #pill.picture { --grow-ms: 460ms; }
  #pill.player .face.showing, #pill.timer .face.showing,
  #pill.history .face.showing, #pill.expanded .face.showing { transition-duration: 280ms; }

  /* The glyph sits exactly where the satellite's does, measured from the outer
     edge: same border, same inset. So while the bubble shrinks into a circle the
     glyph is already on the centre it has to end on, instead of arriving there in
     one jump at the moment the faces are swapped. */
  #media-face, #timer-face, #call-face {
    justify-content: space-between;
    padding: 0 0.4rem 0 var(--glyph-inset);
  }

  #media-art {
    width: var(--mod-glyph);
    height: var(--mod-glyph);
    border-radius: 0.3rem;
    object-fit: cover;
    flex: none;
    background: var(--sunken);
  }
  #media-art, #player-art {
    transition: opacity 150ms ease, transform 150ms var(--ease-grow);
    /* The cover is a base64 data URI and can be a megabyte of it. Without this the
       compositor re-uploads the decoded bitmap on every frame of the slide, which is
       the stutter — promoted once, it is moved rather than redrawn. */
    will-change: transform, opacity;
  }
  /* Leaving and arriving are the same place and the same side: the old cover slides
     out to the left, the picture is changed while it is outside the slot where
     nothing can see it happen, and the new one comes back in from that same left
     edge. A cover that left one way and returned the other read as two pictures
     passing each other rather than as one being replaced.

     The travel clears the slot rather than nudging: at ten pixels the old code was a
     twitch with a cross-fade over it, which is what made a song change read as a
     flicker instead of as a move. */
  .leaving-art, .hidden-art { opacity: 0; transform: translateX(var(--art-exit)); }
  .entering-art {
    opacity: 0;
    transform: translateX(var(--art-exit));
    transition: none;
  }
  /* Its own width and a little more, so it is genuinely gone before it is swapped. */
  #media-art { --art-exit: -32px; }
  #player-art { --art-exit: -76px; }

  /* The edge it leaves by is soft, so the last of it dissolves at the boundary
     instead of being cut off square by the slot it is sliding out of. */
  #media-art-slot, #player-cover {
    mask-image: linear-gradient(90deg, transparent, #000 18%);
  }

  /* Three bars that move only while the sound does — the indicator is the truth
     about playback, not a decoration on top of it. */
  #media-art-slot { display: flex; flex: none; }
  /* As wide as every other glyph, with the bars centred in it: three bars are 13px
     of the 24 the glyph box is, and left-aligning them put the wave off-centre in
     the circle. */
  #equalizer {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    width: var(--mod-glyph);
    height: var(--mod-glyph);
    flex: none;
  }
  #equalizer span {
    width: 3px;
    border-radius: 999px;
    background: var(--app-accent);
    height: 40%;
  }
  /* The bars are driven from script, one swing at a time — see `pulse`. A CSS
     animation cannot do it: its keyframes read the same two custom properties every
     frame, so a new pair landed in the middle of a swing and the bar jumped. */

  /* #endregion ───────────────────────────────────────────────────────────── */
  /* #region ── timer ─────────────────────────────────────────────────────── */

  /* A running timer is the same kind of truth as a playing song, so it looks the
     same at rest: a little wider, the glyph on one side, the reading on the other,
     and never any taller. */
  #pill.timing {
    width: var(--main-width);
    height: var(--pill-height);
  }
  #pill.timer { width: 340px; height: 132px; border-radius: 26px; }


  #timer-glyph {
    width: var(--mod-glyph);
    height: var(--mod-glyph);
    border: 2px solid var(--app-accent);
    border-radius: 999px;
    flex: none;
    position: relative;
  }
  /* The hand sweeps only while the timer runs; a paused timer holds it still. */
  #timer-glyph::after {
    content: "";
    position: absolute;
    /* Half its own width back from the middle, and ending exactly on it: at left:50%
       the hand hung a whole width to the right and pivoted below centre. */
    left: calc(50% - 1px);
    top: 15%;
    width: 2px;
    height: 35%;
    background: var(--app-accent);
    transform-origin: 50% 100%;
  }
  #pill.running #timer-glyph::after { animation: sweep 12s steps(12, end) infinite; }
  /* Twelve ticks, one a second: a hand that glides reads as a stopwatch, one that
     steps reads as a clock. */
  @keyframes sweep { to { transform: rotate(360deg); } }

  #timer-remaining {
    font-size: 0.62rem;
    letter-spacing: 0.02rem;
    color: var(--text-bright);
    font-variant-numeric: tabular-nums;
    /* Usually a countdown, but a stopwatch has no target to count to and One UI puts
       a whole sentence in the summary instead — "Keine Runden abgeschlossen". Left to
       wrap, its second line is drawn below a pill one line tall and cut in half by
       the edge. One line, and what does not fit fades out rather than being cut or
       given an ellipsis: the same treatment #call-name gets, for the same reason. */
    max-width: 104px;
    overflow: hidden;
    white-space: nowrap;
    mask-image: linear-gradient(90deg, #000 calc(100% - 1.2rem), transparent);
    transition: color 200ms ease;
  }
  /* Held, not counting. The reading is still the truth about the timer, so it stays
     where it is and says the same thing — it simply stops claiming to be live. */
  #pill.paused #timer-remaining, #pill.paused #timer-clock {
    color: var(--text-muted);
    font-style: italic;
  }

  #timer-panel {
    flex-direction: column;
    gap: 0.7rem;
    padding: 0 1.1rem;
  }
  #timer-label {
    font-size: 0.6rem;
    letter-spacing: 0.19rem;
    text-transform: uppercase;
    color: var(--app-accent);
  }
  #timer-clock {
    font-size: 1.6rem;
    letter-spacing: 0.08rem;
    color: var(--text-bright);
    font-variant-numeric: tabular-nums;
  }
  #timer-actions { display: flex; gap: 0.6rem; }
  .timer-button {
    padding: 0.4rem 0.9rem;
    border: 1px solid var(--border-control);
    border-radius: 999px;
    font-size: 0.63rem;
    letter-spacing: 0.14rem;
    text-transform: uppercase;
    color: var(--text-body);
  }
  .timer-button:first-child { border-color: var(--app-accent); color: var(--app-accent); }

  /* #endregion ───────────────────────────────────────────────────────────── */
  /* #region ── call ──────────────────────────────────────────────────────── */

  /* A connected call is the third thing that is simply true, so it rests exactly the
     way the other two do: the same width, the same height, a glyph on the left. The
     glyph here is the avatar of whatever is on the other end — a face says which
     call this is faster than any name does. */
  #pill.calling {
    width: var(--main-width);
    height: var(--pill-height);
  }


  /* Discord's voice notification carries no avatar at all — `android.largeIcon` is
     null on every one of them — so the circle holds Discord's own mark unless
     something did supply a picture. Not the crossed-out microphone Discord ships as
     its small icon: that says muted, which is a different fact entirely. */
  .avatar {
    width: var(--mod-glyph);
    height: var(--mod-glyph);
    border-radius: 999px;
    flex: none;
    background: var(--sunken) center / cover no-repeat;
    /* The accent ring is what the pulsing hand and the moving bars are on the other
       mods: it says the call is live, not merely that Discord exists. */
    border: 1.5px solid var(--app-accent);
    box-sizing: border-box;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .avatar svg { width: 62%; height: 62%; display: block; fill: var(--app-accent); }

  /* Kept clear of the middle. The bubble is welded to the cutout, so the camera sits
     in the centre of it and anything starting there is read through a hole — the
     name begins to the right of it, not at it. */
  #call-name {
    font-size: 0.62rem;
    letter-spacing: 0.02rem;
    color: var(--text-bright);
    max-width: 62px;
    overflow: hidden;
    white-space: nowrap;
    /* Clipped left of the first glyph and paid back, so nothing is shaved off it. */
    padding: 0 0.4rem 0 0.2rem;
    margin-left: -0.2rem;
    mask-image: linear-gradient(90deg, #000 calc(100% - 1.2rem), transparent);
  }

  /* A call on the line reads left to right the way the dialer's own screen does:
     the handset, then who it is with, and how long it has lasted at the far end.
     Discord's mod keeps the name off the middle instead — nobody is counting the
     seconds of a voice channel, so there is nothing to put on the right and the
     name is free to start clear of the camera. */
  #call-time {
    font-size: 0.62rem;
    letter-spacing: 0.02rem;
    color: var(--app-accent);
    font-variant-numeric: tabular-nums;
    flex: none;
  }
  #pill.phone-call #call-name {
    /* Whatever the reading does not need, so a long name is cut rather than the
       clock, and a short one leaves the clock exactly where it was. */
    flex: 1 1 0;
    max-width: none;
    min-width: 0;
  }

  /* #endregion ───────────────────────────────────────────────────────────── */
  /* #region ── battery ───────────────────────────────────────────────────── */

  /* The battery is the one thing here that is always true, which is exactly why it
     is never a mod: a bubble carrying it permanently would be a status bar. It is
     shown at the moment it changes — past a mark, or plugged in — and then it is
     gone, so it is an alert that happens to be about the phone itself. */
  #pill.battery { width: 190px; height: var(--pill-height); }
  #battery-face { justify-content: space-between; padding: 0 0.55rem; gap: 0.5rem; }

  #battery-glyph {
    position: relative;
    width: 30px;
    height: 15px;
    flex: none;
    box-sizing: border-box;
    border: 1.5px solid var(--app-accent);
    border-radius: 4px;
  }
  /* The terminal. Drawn rather than styled onto the box, because the fill inside
     must not reach into it. */
  #battery-glyph::after {
    content: "";
    position: absolute;
    left: 100%;
    top: 50%;
    width: 2px;
    height: 6px;
    margin-left: 1.5px;
    transform: translateY(-50%);
    background: var(--app-accent);
    border-radius: 0 2px 2px 0;
  }

  #battery-fill {
    position: absolute;
    inset: 1px;
    width: var(--battery-level, 10%);
    background: var(--app-accent);
    border-radius: 2px;
  }
  /* Low is a heartbeat, not a strobe: the charge is still there, it is just not
     going to be for long. */
  #pill.battery:not(.charging) #battery-fill {
    animation: battery-low 1.6s ease-in-out infinite;
  }
  @keyframes battery-low {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Charging is the charge arriving, over and over: it runs up from where the
     battery actually is to full, holds a beat, fades, and starts again from the
     real level — so the animation never lies about how full the thing is. */
  #pill.battery.charging #battery-fill {
    animation: battery-charge 1.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes battery-charge {
    0% { width: var(--battery-level, 10%); opacity: 1; }
    55% { width: calc(100% - 2px); opacity: 1; }
    78% { width: calc(100% - 2px); opacity: 0.12; }
    79% { width: var(--battery-level, 10%); opacity: 0.12; }
    100% { width: var(--battery-level, 10%); opacity: 1; }
  }

  /* Filled with the bubble's own colour and outlined in the accent, so it reads
     both against the charge behind it and against the empty part. */
  #battery-bolt {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 8px;
    height: 12px;
    display: none;
    fill: var(--pill-background);
    stroke: var(--app-accent);
    stroke-width: 1.2;
    stroke-linejoin: round;
  }
  #pill.battery.charging #battery-bolt { display: block; }

  #battery-reading {
    font-size: 0.62rem;
    letter-spacing: 0.02rem;
    color: var(--text-bright);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* #endregion ───────────────────────────────────────────────────────────── */
  /* #region ── player ────────────────────────────────────────────────────── */

  /* The cover holds the whole left column, top to bottom; the song is read first at
     the top of the right one and the controls sit under it. */
  #player-face {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    /* The bottom row takes what is left, so the rows always fill the pill and the
       square cover is as tall as the pill is inside. */
    grid-template-rows: auto 1fr;
    gap: 0.6rem 0.9rem;
    align-items: center;
    /* The cover is sized by this padding: it fills the content box, so the inset is
       the only knob that makes it smaller. */
    padding: 1.15rem 1rem;
  }

  #player-cover { min-width: 0; grid-column: 1; grid-row: 1 / -1; align-self: stretch; }
  /* A long name is cut off before the wall, not at it: it fades out with room to
     spare, so the bubble never looks like the text is leaking out of it. */
  #player-meta {
    min-width: 0;
    grid-column: 2;
    grid-row: 1;
    overflow: hidden;
    /* The clip has to start left of the first glyph, not on it: letters overhang
       their own box and the box's left edge was shaving them. Paid back with the
       same negative margin, so nothing actually moves. */
    padding: 0 0.5rem 0 0.2rem;
    margin-left: -0.2rem;
    mask-image: linear-gradient(90deg, #000 calc(100% - 1.6rem), transparent);
  }
  #player-art {
    height: 100%;
    width: auto;
    aspect-ratio: 1;
    border-radius: 0.75rem;
    object-fit: cover;
    background: var(--sunken);
    display: block;
  }
  /* A song keeps its own line and runs past the cover column rather than wrapping:
     the transport is lifted clear of that overflow, so the name has room to be long
     without the layout moving under it. */
  #player-title, #player-artist {
    white-space: nowrap;
    overflow: visible;
    line-height: 1.25;
  }
  #player-title {
    font-size: 0.8rem;
    color: var(--text-bright);
  }
  #player-artist {
    margin-top: 0.25rem;
    font-size: 0.68rem;
    letter-spacing: 0.1rem;
    text-transform: uppercase;
    color: var(--app-accent);
  }

  /* Under the song, beside the cover: the bottom row of the right column only. */
  #player-transport {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    min-width: 0;
    grid-column: 2;
    grid-row: 2;
  }
  #player-buttons {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.1rem;
  }
  .transport {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    color: var(--text-body);
    flex: none;
  }
  .transport svg { width: 100%; height: 100%; fill: currentColor; }
  #player-play { width: 44px; height: 44px; color: var(--app-accent); }

  /* The timeline is the whole width the transport does not need, and it takes the
     touch for the track: a 3px bar is drawn thin, not aimed at thin. */
  #player-timeline { display: flex; flex-direction: column; gap: 0.3rem; padding: 0.25rem 0; }
  #player-track {
    height: 4px;
    transition: height 140ms ease-out;
    border-radius: 999px;
    background: var(--border-strong);
    position: relative;
    overflow: hidden;
  }
  #player-elapsed {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    background: var(--app-accent);
    border-radius: 999px;
  }
  /* Under the thumb the bar doubles: the thing being dragged says that it is. */
  #player-timeline.scrubbing #player-track { height: 8px; }

  #player-clock {
    display: flex;
    justify-content: space-between;
    font-size: 0.6rem;
    letter-spacing: 0.1rem;
    color: var(--text-muted);
  }


  /* #endregion ───────────────────────────────────────────────────────────── */
  /* #region ── history face ──────────────────────────────────────────────── */

  #history-face {
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    gap: 0;
    padding: 0.75rem 0.4rem 0.5rem;
    /* Laid out at the width it will end at, from the first frame, rather than at
       whatever width the bubble happens to have grown to. A face measured against a
       box that is still opening re-wraps every one of its lines on every frame of the
       growth — the rows visibly re-flow and re-align themselves as the panel arrives,
       and the last line jumps as it settles. Fixed here and clipped by the bubble, the
       text is set once and the growth only uncovers it. Mirrors SIZES.history.width. */
    width: 340px;
    box-sizing: border-box;
  }

  /* The label names the panel, the number at the far end says how much of it there
     is — the same line, read from both ends. */
  #history-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 0.7rem 0.5rem;
    flex: none;
  }
  #history-label {
    font-size: 0.6rem;
    letter-spacing: 0.19rem;
    text-transform: uppercase;
    color: var(--text-label);
  }
  #history-count {
    font-size: 0.6rem;
    letter-spacing: 0.08rem;
    color: var(--text-label);
    font-variant-numeric: tabular-nums;
  }

  #history-list {
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
    flex: 1 1 auto;
  }
  #history-list::-webkit-scrollbar { display: none; }

  /* A row is as tall as what it has to say. A notification cut to one line is a
     notification you still have to open to read, which is the one thing this panel
     exists to save — and the box is free to grow here, so the text wraps rather than
     fading out. */
  .history-row {
    display: grid;
    grid-template-columns: 3px minmax(0, 1fr);
    gap: 0.6rem;
    align-items: start;
    padding: 0.5rem 0.7rem;
    border-bottom: 1px solid var(--border);
  }
  .history-row:last-child { border-bottom: 0; }
  .history-mark { align-self: stretch; border-radius: 999px; }
  .history-copy { min-width: 0; }
  .history-name {
    font-size: 0.58rem;
    letter-spacing: 0.16rem;
    text-transform: uppercase;
  }
  /* The app on the left, how many of it on the right. */
  .history-head-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem;
  }
  /* A count, not a badge: the group already says whose it is, this only says how
     many arrived while it was folded shut. */
  .history-tally {
    font-size: 0.56rem;
    letter-spacing: 0.06rem;
    color: var(--text-muted);
    flex: none;
  }
  /* Whoever sent it, written once above their lines. */
  .history-who {
    font-size: 0.72rem;
    margin-top: 0.15rem;
    overflow-wrap: anywhere;
  }
  .history-text {
    font-size: 0.72rem;
    line-height: 1.4;
    color: var(--text-muted);
    /* A URL or a long unbroken word has nowhere to break, and would otherwise push
       the row wider than the panel it is in. */
    overflow-wrap: anywhere;
  }
  /* Between two lines of one conversation, not between two conversations: it is set
     short and faint on purpose. The row's own border already says where the group
     ends — this only says that someone pressed send twice. */
  .history-text.divided {
    margin-top: 0.35rem;
    padding-top: 0.35rem;
    border-top: 1px solid var(--border);
  }
  #history-empty {
    font-size: 0.72rem;
    color: var(--text-muted);
    padding: 0.6rem 0.7rem;
  }

  /* #endregion ───────────────────────────────────────────────────────────── */
  /* #region ── quick setting face ────────────────────────────────────────── */

  #quick-face { flex-direction: column; gap: 0.55rem; padding: 0 1.3rem; }

  .quick-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.9rem;
    width: 100%;
  }
  .quick-label {
    font-size: 0.63rem;
    letter-spacing: 0.19rem;
    text-transform: uppercase;
    color: var(--text-label);
    border-radius: 0;
  }

  /* The same liquid the torch's step slider is made of, said as a toggle instead of
     as a scale: the knob does not slide along a track, it is drawn across to the end
     it is going to. What makes that read is the pool waiting at that end — the two
     are in one goo layer, so as the knob comes within reach of it their blurs overlap
     and they arrive as a single shape rather than as a dot that stopped somewhere.
     Off, the pool has drained back to nothing and the knob is alone again.

     A toggle is not a scale, so what carries the state is which end holds the liquid,
     not how much of the track is coloured in. */
  .liquid-switch {
    position: relative;
    width: 52px;
    height: 28px;
    flex: none;
  }
  .switch-rail {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: var(--sunken);
    border: 1px solid var(--border-control);
    transition: border-color 200ms ease;
  }
  .switch-flow { position: absolute; inset: 0; filter: url(#switch-goo); }

  /* Everything in a goo layer is solid — a half-transparent shape falls below the
     contrast's threshold and is erased rather than merged — so these change size,
     never opacity. */
  .switch-knob {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 20px;
    height: 20px;
    border-radius: 999px;
    background: var(--text-icon);
    transition: transform 260ms var(--ease-enter), background 200ms ease;
  }
  .switch-pool {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    border-radius: 0.5rem;
    background: var(--section-color);
    transform: scale(0);
    transform-origin: 100% 50%;
    transition: transform 260ms var(--ease-enter);
  }
  .liquid-switch.on .switch-knob {
    transform: translateX(24px);
    background: var(--section-color);
  }
  .liquid-switch.on .switch-pool { transform: scale(1); }
  .liquid-switch.unavailable { opacity: 0.45; }
  .liquid-switch.on .switch-rail { border-color: var(--section-color); }

  /* #endregion ───────────────────────────────────────────────────────────── */

  #indicators {
    position: absolute;
    top: 4px;
    right: 8px;
    display: flex;
    gap: 4px;
    z-index: 2;
  }
  .indicator {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    display: none;
    /* Life, not decoration: the pulse says the sensor is live right now. */
    animation: indicator-pulse 1.8s ease-in-out infinite;
  }
  .indicator.active { display: block; }
  #microphone-dot { background: var(--section-color); }
  #camera-dot { background: var(--camera); }
  @keyframes indicator-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  /* #region ── satellites ────────────────────────────────────────────────── */

  /* More than one thing can be true at once — a song and a timer — and only one of
     them can own the bubble. The others split off it as circles: the bubble pulls
     its width in a little and a satellite pops out of the edge it left behind, which
     is why the satellite starts tucked inside the bubble at a fraction of its size
     rather than fading in where it lands. One satellite a side; the main bubble
     stays on the cutout and the window shifts under it instead. */
  .satellite {
    position: absolute;
    top: var(--grab, 0px);
    left: 50%;
    width: var(--sat-width, var(--pill-height));
    height: var(--pill-height);
    border-radius: 999px;
    background: var(--pill-background);
    border: 1px solid var(--border);
    display: grid;
    /* Left, like the glyph in the bubble itself: the satellite is the same layout at
       a smaller width, so when it grows into the bubble the glyph is already where
       it has to end up and simply stays put while the width arrives around it. At
       circle width this padding centres it anyway. */
    justify-items: start;
    align-items: center;
    box-sizing: border-box;
    /* Less the border, which the box already spends on the left: without that the
       glyph sat two pixels right of the circle's middle. */
    padding-left: var(--glyph-inset);
    overflow: hidden;
    opacity: 0;
    /* Born standing exactly on the bubble's own glyph — same size, same inset, left
       edges flush — because that is where the thing it carries already was. It is
       not shot out beside the bubble: it is the glyph leaving, and the width the
       bubble gives up is the room it goes into. */
    transform:
      translateX(calc(var(--sat-birth, 0px) - var(--sat-width, var(--pill-height)) / 2))
      scale(1);
    transition:
      transform var(--split-ms, 380ms) var(--ease-split),
      width var(--grow-ms) var(--ease-grow),
      opacity 120ms ease;
  }

  .satellite.showing {
    opacity: 1;
    /* Late on purpose: the bubble pulls its width in first, and only then does the
       piece it gave up appear. Both at once reads as one box growing. */
    transition-delay: var(--split-delay, 150ms);
    transform: translateX(
      calc(var(--sat-x, 0px) - var(--sat-width, var(--pill-height)) / 2)
    ) scale(1);
  }

  /* Under a finger nothing eases: the swap follows the drag frame for frame, and
     the easing is only for where it lands once the finger is gone. */
  .dragging #pill,
  .dragging .satellite { transition: none; }

  /* Past two satellites there is no third side to give away, so the rest of the row
     is counted rather than drawn: a dot each, in its own app's colour, outside the

    align-items: center;
    justify-content: space-between;
    padding: 0 0.4rem 0 var(--glyph-inset);
    overflow: hidden;
    opacity: 0;

     light in front of every one of them, and the markup order backs it up. */

     transform, because the transform is the flight out and home and has an owner
     already — two writers on one property is one of them losing. */

     overlap come back as one outline, and shapes that do not keep their own. That
     is the whole of the liquid — there is no second element bridging them. -->

       are one body of water that happens to be in several places. The deviation is
       not written here because it is not a constant — meltBy() reads it off the gap
       between the shapes every frame, so they fuse as they come together and let go
       as they part. Shapes bridge at roughly twice whatever it currently is. -->

       either apart or wholly on top of each other and never rest a hair's breadth
       apart, which is the one case a constant is right for. Same numbers as the
       torch's step slider, because it is the same liquid. -->
  <filter id="switch-goo" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blurred"/>

   * The viewport never changes — the WebView is a fixed-size stage the host window
   * only clips — so this waits for nothing but the window's own next frame, which
   * is all that is needed for the growth not to be clipped on its first frame.
   */
  function afterRelayout(work) {
    // One frame, not two. The viewport genuinely never changes — the stage is a
    // fixed size the host window only clips — so nothing here is waiting for a
    // re-layout, only for the window to have been given its new clip. The second
    // frame was insurance, and it was insurance paid at the exact moment a growth
    // is meant to start, which is where it was read as a stall.
    requestAnimationFrame(work);
  }

  function paintSize() {
    pill.classList.toggle('alerting', size === 'alert' || size === 'image');
    pill.classList.toggle('expanded', size === 'haptic');
    pill.classList.toggle('picture', size === 'picture');
    pill.classList.toggle('history', size === 'history');
    pill.classList.toggle('playing', size === 'playing');
    pill.classList.toggle('player', size === 'player');
    pill.classList.toggle('timing', size === 'timing');
    pill.classList.toggle('calling', size === 'calling');

    pill.classList.toggle('battery', size === 'battery');
    pill.classList.toggle('timer', size === 'timer');

    // The skin only exists for the closed row: a grown panel is one shape with
    // nothing to merge into, so it paints its own background and the filter stops.
    root.classList.toggle('liquid', CLOSED.has(size));
    if (!CLOSED.has(size)) {
      // Opening is a growth, not a split, and must not inherit the split's curve or
      // the wait a departing satellite left behind.
      root.style.setProperty('--width-ease', 'var(--ease-grow)');
      root.style.setProperty('--width-ms', 'var(--grow-ms)');
      root.style.setProperty('--width-delay', '0ms');
      root.style.setProperty('--face-delay', '0ms');
      root.style.setProperty('--face-fade', '0ms');
    }
    stirLiquid();
    paintBlur();
  }

  /**
   * The blur is a window effect, so the page cannot draw it and the CSS cannot
   * animate it. What the page can do is say where the bubble is going and how long
   * it is taking, and let the host run the same curve on the blurred region — this
   * is the bubble's own size, not the window's, because the window carries the
   * invisible grab margin as well and a blur that wide is visibly too big.
   */
  /**
   * What a satellite's own move is set to right now, read off the same custom
   * properties the CSS is reading rather than named a second time here — the split's
   * length and its head start are written per phase by stageSplit(), and a number
   * copied into the host would be the one that goes stale.
   */
  function splitMillis() {
    const satellite = satellites[satSide];
    return parseFloat(getComputedStyle(satellite).getPropertyValue('--split-ms')) || 380;
  }

  function splitDelay() {
    const satellite = satellites[satSide];
    // Only a satellite that is showing is held back; one still arriving has already
    // spent its delay getting here.
    if (!satellite.classList.contains('showing')) return 0;
    return parseFloat(getComputedStyle(satellite).getPropertyValue('--split-delay')) || 150;
  }

  function paintBlur(handOff) {
    const target = windowFor(size);
    const height = target.height < 0 ? compact.height : target.height;
    // restingMain(), never compact.width: the closed bubble is not always the size it
    // was configured at — the torch chip taxes it — and the glass has to be the size
    // the bubble actually is. The blur is a separate region in a different process
    // and shares nothing with the CSS, so every size the page changes has to be told
    // to it by hand or it keeps the old one.
    const width = target.main ||
      (target.width < 0 ? (CLOSED.has(size) ? restingMain() : compact.width) : target.width);
    const grow = parseFloat(
      getComputedStyle(pill).getPropertyValue('--grow-ms')
    ) || 340;
    // A drag has no curve to follow: it is already where the finger put it.
    const dragging = root.classList.contains('dragging');
    const box = CLOSED.has(size)
      ? layout()
      : { mainX: 0, sat: 0, satX: 0, farX: 0, farFade: 1 };
    const live = CLOSED.has(size) ? liveMods().length : 0;
    // An open bubble owns the middle of the window on its own: whatever offset the
    // closed pair left behind has to go, or it opens off the cutout.
    if (!handOff) root.style.setProperty('--shift', box.mainX + 'px');

    // The moment a swap is committed the two boxes have swapped names but not places:
    // the new bubble is standing in the satellite's slot at the satellite's size, and
    // it is the settle afterwards that carries it home. The glass is a region in
    // another process and takes the same journey by being told it — told the settled
    // geometry here instead, it spent the whole settle as a full-width frosted panel
    // around a bubble that was neither that wide nor in that place, which reads as
    // the bubble briefly growing out one side and then snapping back.
    const seen = handOff || box;

    sendBlur(
      handOff ? handOff.width : width,
      height,
      CORNERS[size] === undefined ? Math.round(height / 2) : CORNERS[size],
      Math.round(seen.mainX),
      live > 1 ? Math.round(seen.sat) : 0,
      Math.round(seen.satX),
      // The wrapping satellite is never mid-trade, so it stays a circle. Glass cannot
      // fade, so it shrinks instead: by the time the circle is invisible its pane has
      // closed to nothing, and neither is left hanging over the wallpaper.
      live > 2 && satelliteLimit() > 1 ? Math.round(compact.height * seen.farFade) : 0,
      Math.round(seen.farX),
      // A hand-off is not a journey: it is the same pixels under a new name, so the
      // glass has to be put there outright. Any duration at all and it slides across
      // from wherever it was.
      dragging || handOff ? 0 : Math.round(grow),
      // The satellites are not on the bubble's clock. They move on the split's own
      // curve, for the split's own length, and they are held back while the bubble
      // narrows ahead of them — so their glass is given all three rather than being
      // swept along with the main region and arriving early on a straighter line.
      dragging || handOff ? 0 : Math.round(splitMillis()),
      dragging || handOff ? 0 : Math.round(splitDelay())
    );
  }

  /**
   * The glass, handed over on the frame the bubble's own change is drawn on.
   *
   * The two live in different processes and start on different clocks: a style written
   * here does not take effect until the page renders its next frame, while a bridge
   * call is on the host's looper and its animator starts the moment it is posted. So
   * the glass set the same way round as the CSS *led* it — it began moving a frame or
   * more before the shape it belongs to, which is exactly the seam you can see on a
   * fast state change. Held to the next animation frame it starts with the paint it
   * belongs to instead.
   *
   * Only the last call of a frame is sent, which is also the only one that frame can
   * draw: a drag paints on every touch move and was posting a bridge call for each.
   */
  let blurPending = null;

  function sendBlur() {
    const waiting = blurPending !== null;
    blurPending = Array.prototype.slice.call(arguments);
    if (waiting) return;
    requestAnimationFrame(() => {
      const sending = blurPending;
      blurPending = null;
      bridge.setBlurBounds.apply(bridge, sending);
    });
  }

  /** The states the bubble rests in: bare, or under a mod. */
  const CLOSED = new Set(['idle', 'playing', 'timing', 'calling']);

  // #region ── liquid ─────────────────────────────────────────────────────────

  /**
   * The row's skin, drawn as solid shapes under one metaball filter so the bubble
   * and whatever has split off it can actually run together. The shapes are not
   * positioned by rules of their own: they are *mirrored* off the boxes they stand
   * for, frame by frame, which is the only way a skin can follow a transition, a
   * drag and a hold at once without every one of those rules being written twice.
   */
  const liquidLayers = {
    edge: document.getElementById('liquid-edge'),
    fill: document.getElementById('liquid-fill'),
  };

  /**
   * One blob a layer for each box the row is made of, made once and kept. The Now
   * bubble is one of them: that is the whole point of it being drawn in this page
   * rather than in a window of its own, and it is why the drop can be seen leaving
   * the bubble at the punch hole instead of simply appearing out by the clock.
   */
  const blobs = ['main', 'left', 'right', 'now'].map(name => ({
    name,
    edge: liquidLayers.edge.appendChild(document.createElement('div')),
    fill: liquidLayers.fill.appendChild(document.createElement('div')),
  }));
  blobs.forEach(blob => { blob.edge.className = 'blob'; blob.fill.className = 'blob'; });

  /** The one primitive whose strength changes with how close the shapes are. */
  const liquidBlur = document.getElementById('bubble-melt');
  let meltNow = null;

  /** Which box each blob is the skin of. */
  function sourceOf(name) {
    if (name === 'main') return pill;
    if (name === 'now') return nowPill;
    return satellites[name];
  }

  /**
   * A satellite that is not dressed has no skin: it is not merely invisible, it is
   * not part of the row. A dressed one always has skin even while it is tucked
   * inside the bubble at a fraction of its size — that is exactly where the merge
   * comes from, and fading it instead would put a half-transparent shape under the
   * filter, which erases it rather than dimming it.
   */
  function isSkinned(name) {
    if (name === 'main') return true;
    // The Now bubble has a skin only while the light is on. Dark it is still in the
    // page, a zero-opacity box standing at its spot, and a blob mirrored off it would
    // be a permanent lump of liquid out by the clock.
    if (name === 'now') return nowPill.classList.contains('lit');
    return Boolean(satellites[name].dataset.mod);
  }

  /** Every rect first, every write after: one layout per frame instead of three. */
  function paintLiquidFrame() {
    const measured = blobs.map(blob => {
      if (!isSkinned(blob.name)) return null;
      const source = sourceOf(blob.name);
      const style = getComputedStyle(source);
      return {
        box: source.getBoundingClientRect(),
        radius: style.borderRadius,
        colour: style.borderTopColor,
      };
    });

    blobs.forEach((blob, index) => {
      const seen = measured[index];
      if (!seen || !seen.box.width) {
        blob.edge.style.display = 'none';
        blob.fill.style.display = 'none';
        return;
      }
      blob.edge.style.display = '';
      blob.fill.style.display = '';
      // The border was inside the box it came from, so the skin keeps it there: the
      // edge is the box itself and the fill is a pixel in from it. Drawing the edge
      // *outside* instead would leave the bubble two pixels wider than it was.
      write(blob.edge, seen.box, 0, seen.radius);
      write(blob.fill, seen.box, -1, seen.radius);
      blob.edge.style.background = seen.colour;
    });

    meltBy(measured);
  }

  /**
   * How strongly the skin runs together, from how far apart the shapes actually are.
   *
   * A fixed deviation cannot do this job: the shapes bridge at about twice it, so one
   * strong enough to fuse a satellite leaving the bubble welds the whole row into a
   * single bar for as long as it stands there, and one weak enough to leave the row
   * alone never merges anything at all. There is no number that is both. So it is not
   * a number — it is read off the gap every frame, which is what liquid does anyway:
   * two drops pull together as they come near and let go as they part, and nothing
   * about that is a constant.
   */
  function meltBy(measured) {
    const boxes = measured.filter(seen => seen && seen.box.width)
      .map(seen => seen.box)
      .sort((left, right) => left.left - right.left);
    let closest = Infinity;
    for (let index = 1; index < boxes.length; index += 1) {
      closest = Math.min(closest, boxes[index].left - boxes[index - 1].right);
    }
    // Touching or overlapping is full strength; a resting row is far enough out to be
    // left as separate shapes. Between the two the neck forms and thins on its own.
    const melt = closest === Infinity
      ? MELT_MIN
      : Math.min(MELT_MAX, Math.max(MELT_MIN, MELT_MAX - closest * 0.5));
    if (melt !== meltNow) {
      meltNow = melt;
      liquidBlur.setAttribute('stdDeviation', melt);
    }
  }

  function write(shape, box, grow, radius) {
    shape.style.width = (box.width + grow * 2) + 'px';
    shape.style.height = (box.height + grow * 2) + 'px';
    shape.style.transform =
      'translate(' + (box.left - grow) + 'px,' + (box.top - grow) + 'px)';
    shape.style.borderRadius = radius;
  }

  /**
   * The mirror runs only while something can still be moving. A permanent frame loop
   * under a window that is on screen all day is a battery bill for nothing, so every
   * paint that could start a transition says so and the loop outlives it by one
   * animation, then stops on its own with the shapes left where they landed.
   */
  let liquidUntil = 0;
  let liquidFrame = null;

  function stirLiquid(milliseconds) {
    if (!root.classList.contains('liquid')) return;
    // Past the longest choreography there is, which is a mod being taken back in.
    liquidUntil = Math.max(liquidUntil, performance.now() + (milliseconds || 1100));
    if (liquidFrame === null) liquidFrame = requestAnimationFrame(flowLiquid);
  }

  function flowLiquid() {
    paintLiquidFrame();
    liquidFrame = performance.now() < liquidUntil
      ? requestAnimationFrame(flowLiquid)
      : null;
  }

  // #endregion ────────────────────────────────────────────────────────────────

  // #region ── satellites ─────────────────────────────────────────────────────

  const root = document.documentElement;
  const satellites = {
    right: document.getElementById('satellite-right'),
    left: document.getElementById('satellite-left'),
  };
  const dotGroups = {
    right: document.getElementById('dots-right'),
    left: document.getElementById('dots-left'),
  };

  /**
   * The closed row, as places rather than as cases. Whatever is true takes the next
   * place outwards from the middle:
   *
   *   … dot dot [satellite] (bubble) [satellite] dot dot …
   *
   * The bubble is whatever leads the order, the next two get a circle a side, and
   * everything after that is counted with a dot on alternating sides. Adding a fifth
   * kind of mod needs nothing here — it is the length of the list that decides.
   */
  const DOT_SIZE = 6;
  const DOT_GAP = 5;

  /** The mods that get a dot rather than a circle, nearest the bubble first. */
  function dotted() {
    const spread = { right: [], left: [] };
    // Whatever is past the circles the row is allowed. With the Now bubble out that is
    // one circle rather than two, so the mod that had been the far satellite becomes the
    // first dot — counted onto the satellite's own side, because with one circle there
    // is no other side to alternate onto.
    const limit = satelliteLimit();
    liveMods().slice(1 + limit).forEach((mod, index) => {
      spread[limit > 1 && index % 2 !== 0 ? otherSide(satSide) : satSide].push(mod);
    });
    return spread;
  }

  /** The room one side needs for its dots, the gap to the circle included. */
  function dotRoom(count) {
    return count ? DOT_GAP + count * DOT_SIZE + (count - 1) * DOT_GAP : 0;
  }

  /** What each mod looks like once it is a circle of its own. */
  const SATELLITE_FACES = {
    // The album art, not the bars: what left the bubble has to be what turns up in
    // the circle, or the eye has no reason to believe they are the same thing.
    media: '<img class="sat-art glyph" alt="">',
    timer: '<div class="sat-clock"></div>',
    call: '<div class="sat-avatar avatar"></div>',

  };

  /** Which side the satellite hangs off. A committed swap puts it on the other. */
  let satSide = 'right';

  /** How far a drag has traded the bubble's width for the satellite's, 0 to 1. */
  let swap = 0;

  /** Which of the two satellites the drag is pulling in: 1 the near one, -1 the far. */
  let swapDir = 1;

  /** True for the one frame between a swap being committed and the pair settling. */
  let settling = false;

  /**
   * How far the wrapping satellite is shoved past its slot before it changes sides.
   * Half its own width, which is exactly the room the window has left over — and it
   * is fully faded by the time it gets there, so the edge never clips anything seen.
   */
  const FAR_PUSH = 17;

  /** Whether a mod is actually true right now, not merely remembered. */
  function isLive(mod) {
    if (mod === 'timer') return mods.has('timer') && Boolean(timer);
    if (mod === 'media') return mods.has('media') && Boolean(media);
    if (mod === 'call') return mods.has('call') && Boolean(call);

    return false;
  }

  /** Whatever payload a mod is carrying, so the satellites can read them alike. */
  function payloadOf(mod) {
    if (mod === 'media') return media;
    if (mod === 'timer') return timer;

    return call;
  }

  /** The mods that are true, in the order a swipe has left them in. */
  function liveMods() {
    return modOrder.filter(isLive);
  }

  /** The mod's own colour, so a satellite keeps the app's identity beside the bubble. */
  function accentOf(mod) {
    const payload = payloadOf(mod);
    return (payload && payload.accent) || 'var(--section-color)';
  }

  /** A satellite at rest is a circle: exactly as tall as the bubble, and as wide. */
  function satSize() {
    return compact.height;
  }

  /**
   * Where a circle stands when the glyph it holds is exactly the bubble's glyph.
   * Both boxes carry the same inset at the same end, so that is simply their left
   * edges flush — and from there the picture can be handed from one to the other
   * without moving, which is the whole trick behind a split reading as one thing
   * leaving rather than two things being drawn.
   */
  function glyphAligned(box) {
    return box.mainX - box.main / 2 + satSize() / 2;
  }

  /**
   * True while the Now bubble is standing out on the bar.
   *
   * It used to mean one small thing — the closed bubble gave up a little width so that
   * two pills fitted on one status bar — and it means something larger now: the bar is
   * the Now bubble's as well, so the row stands aside for it rather than shaving
   * itself. Everything below reads this: where the row stands, how many circles it is
   * allowed, and how wide the Now bubble may grow.
   */
  let chipOut = false;

  /** How long the row takes to stand aside for the light, or to come back. */
  const SHIFT_HOME = 100;
  /** True while that move is the one being painted, so the ordinary curve stays out of it. */
  let shiftingHome = false;
  let shiftTimer = null;

  window.onTorchChip = out => {
    if (chipOut === out) return;
    chipOut = out;
    // Standing aside is not a growth and does not take a growth's time. The row is not
    // changing shape here — it is the same row in a different place — and at the growth's
    // length it read as the bubbles wandering back rather than snapping into the space
    // the light had just left. No delay either: the delay exists to hold a step aside
    // until a width has come in, and there is no width moving here.
    shiftingHome = true;
    clearTimeout(shiftTimer);
    shiftTimer = setTimeout(() => { shiftingHome = false; }, SHIFT_HOME + 40);
    // The row's whole shape depends on this — its place, its satellites, its dots — so
    // it is repainted rather than nudged, and the glass and the window go with it.
    // Nothing here is worked out by the CSS: the glass is a region of the host's window
    // and the proxy is a window of its own, and both keep whatever they were last told.
    if (state === 'idle') toClosed();
    else {
      paintSatellites();
      ensureClosedWindow();
    }
    paintBlur();
  };

  /**
   * How far right the closed row stands. Nothing while the bar is the row's own; with
   * the Now bubble out, exactly enough to bring the bubble's left edge to the punch
   * hole — which is the bare bubble's left edge, since the bare bubble is the one drawn
   * around the hole. A mod then grows to the right from the hole instead of out either
   * side of it, and everything hanging off the bubble travels with it.
   */
  /**
   * The camera's own hole, plus the margin nothing is allowed inside. Measured off the
   * phone rather than mirrored from anywhere: it is a hole in the glass.
   */
  const HOLE_WIDTH = 34;

  function rowShift(resting) {
    // A bare bubble has no glyph to protect and is the bubble drawn around the hole in
    // the first place, so it does not move at all — it is the mods that are pushed.
    if (!chipOut || !liveMods().length) return 0;
    // Mirrors --mod-glyph and --glyph-inset in the CSS above, which are the same two
    // numbers off the same bubble height.
    const glyph = compact.height - 10;
    const inset = (compact.height - glyph) / 2 - 1;
    // The left edge that stands the glyph's far side exactly on the hole's near one:
    // the mod's icon is the first thing in the bubble, and it is what the hole eats.
    const clear = window.innerWidth / 2 - HOLE_WIDTH / 2 - glyph - inset + CHIP_ROOM;
    return Math.max(0, clear - (window.innerWidth / 2 - resting / 2));
  }

  /** The closed row's left edge, which is what the Now bubble grows up to. */
  function rowLeftEdge() {
    const resting = restingMain();
    return window.innerWidth / 2 - resting / 2 + rowShift(resting);
  }

  /**
   * How many circles may stand beside the bubble. One while the Now bubble is out: the
   * bar it has left is not wide enough for two, and a row that overflows into the punch
   * hole is worse than a row that counts.
   */
  function satelliteLimit() {
    return chipOut ? 1 : 2;
  }

  /** How far the circle stands off the bubble, which depends on how much bar there is. */
  function satGap() {
    return chipOut ? SAT_GAP_ASIDE : SAT_GAP;
  }

  function restingMain() {
    // Mid-merge the bubble is the bare closed bubble and nothing else, whatever is
    // still true: the mod that is coming has not arrived yet, and the bubble must
    // not already be the width of something it is not yet carrying.
    if (mergeHold) return compact.width;
    const live = liveMods();
    if (!live.length) return compact.width;
    return compact.width + MOD_WIDTH + 4 - (live.length > 1 ? SPLIT_SHRINK : 0);
  }

  /**
   * Where everything sits right now, drag included.
   *
   * The two widths trade — whatever the bubble gives up the satellite takes — and
   * the centre travels with them: whichever of the two is currently the big one sits
   * on the cutout, so a swap is one thing sliding into the middle while the other
   * retreats to the side it shrank towards. The distance between their centres works
   * out constant, so the gap never breathes.
   */
  function layout() {
    const live = liveMods();
    const resting = restingMain();
    const push = rowShift(resting);
    if (live.length < 2) {
      return {
        main: resting, sat: satSize(), mainX: push, satX: push,
        inSide: satSide, farX: push, farFade: 1, edge: 0, reach: 0, push,
      };
    }
    const traded = (resting - satSize()) * swap;
    // Which satellite the drag is pulling into the middle. With one satellite it can
    // only ever be that one; with both sides taken the finger picks, and the side it
    // picked is the side everything else is measured from.
    // Only a drag in progress can move it off the resting side. A direction left over
    // from a drag that was abandoned used to survive into the next paint, and the two
    // circles were drawn on each other's sides while nothing was being dragged at all.
    const inSide = live.length > 2 && satelliteLimit() > 1 && swapDir < 0 &&
      root.classList.contains('dragging')
      ? otherSide(satSide)
      : satSide;
    const edge = inSide === 'right' ? 1 : -1;
    // Half of both widths plus the gap: the same whichever of them is the big one,
    // which is why this is a constant and not a function of the drag.
    const reach = (resting + satSize()) / 2 + satGap();
    // Past halfway the swap is decided, so the far one is drawn where it will land.
    const crossed = swap > 0.5;
    const shoved = crossed ? (1 - swap) * 2 : swap * 2;
    return {
      main: resting - traded,
      sat: satSize() + traded,
      mainX: push - edge * swap * reach,
      satX: push + edge * (1 - swap) * reach,
      inSide,
      push,
      // The one on the far side, when a third mod is true. It is the only piece that
      // has to end up at the other end of the row, and a circle flying the whole way
      // across the bubble to get there reads as a glitch. So it is shoved further out
      // by the bubble arriving over it, fading as it goes, and is already gone by the
      // halfway mark — where it changes sides and comes back in from the other edge.
      farX: push + (crossed ? edge : -edge) * (reach + FAR_PUSH * shoved),
      farFade: Math.min(1, Math.abs(swap - 0.5) * 2),
      edge,
      reach,
    };
  }

  /** The side a satellite is not on. */
  function otherSide(side) {
    return side === 'right' ? 'left' : 'right';
  }

  /**
   * The window a closed bubble needs. With a satellite it is symmetric and never
   * moves: it holds the bubble centred plus a satellite's worth of room on *both*
   * sides, because the pair slides across it during a drag and a window that had to
   * follow that would be resized under the finger — which cancels the touch.
   */
  function closedTarget() {
    const box = layout();
    const live = liveMods();
    const spread = dotted();
    // Symmetric, and sized by whichever side is carrying more: the row slides across
    // this window during a drag, and a window that had to be resized under the finger
    // cancels the touch.
    const counted = Math.max(dotRoom(spread.right.length), dotRoom(spread.left.length));
    const room = live.length > 1 ? 2 * (satSize() + satGap() + counted) : 0;
    return {
      width: restingMain() + room,
      height: -1,
      // The row stands aside for the Now bubble, and every pixel of it that can be
      // touched is in this window — so the window stands aside too, or the bubble is
      // being aimed at through a hole in the wrong place.
      shift: box.push,
      // What the bubble itself is drawing, which the blur follows.
      main: box.main,
    };
  }

  /**
   * The mods that do not own the bubble, as circles beside it. Only one can be
   * beside it so far; a third mod is the moment to draw dots rather than to invent
   * a third side.
   */
  function paintSatellites() {
    // The bar left of the bubble belongs to the Now bubble while it is out, so a
    // satellite that a swap has left standing there moves over. It is not hidden and it
    // is not forbidden — it simply has one side to be on.
    if (chipOut && satSide === 'left') satSide = 'right';
    layoutSatellites();
    fitNowWidth();
    stirLiquid();
    // Under a finger the skin cannot be a frame behind what it is the skin of: the
    // content would slide out of its own fill. Everything else has a transition to
    // follow and is mirrored by the loop.
    if (root.classList.contains('dragging')) paintLiquidFrame();
  }

  function layoutSatellites() {
    const live = liveMods();
    const box = layout();
    stageSplit(live.length);
