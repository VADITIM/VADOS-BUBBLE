    // Mid hand-off this box is not the one to paint: swap is already back at 0 and
    // satSide already flipped, so it is the row's full-width, dead-centre resting
    // shape — correct for where things are going, wrong for where the hand-off has
    // actually stood them. commitTrade/commitRotation paint the real one right
    // after toClosed() returns; painting this one first is the split-second flash.
    if (!settling) {
      root.style.setProperty('--main-width', box.main + 'px');
      root.style.setProperty('--shift', box.mainX + 'px');
      // Under a finger there is no sequence to stage: everything tracks the drag. Nor
      // after a swap, and that one cost a visible bug — the delay exists for a split,
      // where the bubble narrows first and only then steps aside, but a swap has
      // already put both boxes where they belong. Holding the step aside for another
      // 120ms left the new bubble standing at the width it had just taken, off its own
      // centre, for exactly that long before it slid over: read as the bubble being
      // wider on one side for a moment and then correcting itself.
      root.style.setProperty(
        '--shift-delay',
        root.classList.contains('dragging') || shiftingHome ? '0ms' : '120ms'
      );
      root.style.setProperty(
        '--shift-ms', shiftingHome ? SHIFT_HOME + 'ms' : 'var(--grow-ms)'
      );
      // The glass moves with them, and it is one region per bubble.
      paintBlur();
    }
    paintDots(box);

    // One satellite and two are different things, not the same thing with a count.
    // With one it is a trade between two bubbles and the sides change hands; with two
    // the sides are fixed and the row rotates through them, which is a third motion —
    // the wrap — that has no meaning at all in the pair. They were one loop with a
    // flag in it, and the flag was read wrong in the case that happens most.
    if (live.length < 2) {
      clearSatellite('right');
      clearSatellite('left');
      return;
    }
    // One circle, whether that is because one mod is beside the bubble or because the
    // Now bubble is out and the row is allowed only one. The far one is not hidden: it
    // is aimed at the bubble and run into it, which is what clearSatellite does, and the
    // bubble takes the knock. What it turns into is the dot paintDots has already drawn.
    if (live.length === 2 || satelliteLimit() === 1) {
      clearSatellite(otherSide(satSide));
      paintTrader(satellites[satSide], live[1], box);
      return;
    }
    const inSide = box.inSide;
    paintTrader(satellites[inSide], live[inSide === satSide ? 1 : 2], box);
    paintWrapper(satellites[otherSide(inSide)], live[inSide === satSide ? 2 : 1], box);
  }

  /**
   * A mod leaving is not the split played backwards at the same speed. Going out,
   * the bubble lets go and the piece it dropped shoots away — quick, and read at a
   * glance. Coming back, three things have to be seen in order, and each of them is
   * the cause of the next: the circle travels into the bubble, the bubble takes it
   * in, and only then does it open out around what it has just swallowed. Played at
   * the speed of the split all three land on top of each other and it reads as one
   * box resizing for no reason.
   */
  /**
   * The circle's run into the middle of the bubble. Long enough to be the visible
   * cause of what follows, and no longer: the bare closed bubble is a moment the
   * merge passes through, not a state it stops in.
   */
  const MERGE_TRAVEL = 260;

  /**
   * The bubble opening out around what has arrived. The circle is still holding the
   * glyph through all of it and travels with the edge, so this is one number for
   * both of them.
   */
  const MERGE_EXPAND = 300;

  /**
   * A mod taking the bubble arrives as its glyph: up out of the middle, small
   * enough to sit inside the camera hole, landing on the left with the split's
   * overshoot. Only then is there something at the edge for the bubble to open out
   * around.
   */
  const MOD_ENTER = 300;

  /**
   * Where in the arrival the glyph is actually at the left edge, as a share of the
   * whole thing. Not the end of it: the split curve overshoots by a good half of
   * its travel and then settles back, so the glyph is furthest left about a third
   * of the way in and spends the rest of the time coming to rest.
   *
   * Waiting for the animation to *finish* is what read as a pause between two
   * movements — the icon shot out, stopped, and only then did the bubble notice.
   * The bubble opens out at the moment the glyph reaches the wall, which is also
   * the moment it is pushing hardest on it, so the two are one movement.
   */
  const LAND = 0.38;

  /**
   * True while the bubble is the bare closed bubble waiting for a circle to reach
   * it. A mod stopping is not the bubble changing shape: the mod closes, the bubble
   * is left closed and bare, and it becomes a mod bubble again only because
   * something arrived and made it one.
   */
  let mergeHold = false;
  let mergeTimer = null;

  /** Set for the one paint that is the bubble opening out around what it took in. */
  let takingIn = false;

  /** How many mods were true the last time the row was drawn. */
  let lastLive = 0;

  /**
   * A width change in the closed row is a split or a merge, never a growth, so it
   * takes the split's own curve — the same overshoot the satellite leaves on, which
   * is what makes the pair read as one thing letting go rather than two boxes
   * resizing. A width change with the same mods still true is neither, and keeps
   * the plain curve: an alert collapsing back should not bounce.
   */
  function stageSplit(count) {
    const changed = count !== lastLive;
    const leaving = count < lastLive;
    lastLive = count;
    // The second half of a merge: the bubble is not changing its mind about how many
    // mods are true, it is opening out around the one that has just arrived.
    const arriving = takingIn;
    takingIn = false;
    const moving = changed || arriving;
    root.style.setProperty('--width-ease', moving ? 'var(--ease-split)' : 'var(--ease-grow)');
    root.style.setProperty(
      '--width-ms',
      arriving ? MERGE_EXPAND + 'ms' : leaving ? '240ms' : changed ? '380ms' : 'var(--grow-ms)'
    );
    // The order is sequenced in JS now, one visible cause at a time, so no part of
    // it waits on a delay of its own.
    root.style.setProperty('--width-delay', '0ms');
    // The mod that has stopped being true takes its face off the bubble at once —
    // it is the first thing that happens and the reason for everything after it.
    root.style.setProperty('--face-fade', arriving ? '260ms' : leaving ? '140ms' : '0ms');
  }

  /**
   * A mod that has stopped being true does not blink out where it stands, and it
   * does not fly back to an edge either. It goes to the one place its glyph has a
   * right to be — the bubble's own glyph slot, left edges flush — because from
   * there the picture can simply be handed over: the circle stops drawing it and
   * the bubble starts, in the same place, at the same size, on the same frame.
   *
   * The inline geometry is what carries it there, so it is kept for the whole
   * journey and cleared at the end rather than at the start: wiping it first left
   * the circle to vanish on the spot while the bubble grew for no visible reason.
   */
  function clearSatellite(side) {
    const element = satellites[side];
    if (!element.dataset.mod || element.dataset.leaving) return;
    // A swap is not a mod ending. The circle is vacated because the mod it was
    // holding has just become the bubble — which is already drawing that same glyph,
    // in its own slot, this very frame. Flown home the way a departing mod is, it
    // spends the whole merge as a second copy of the icon crawling into the first:
    // two timers, two avatars. Nothing is leaving here, so nothing travels.
    if (settling) {
      dropSatellite(element);
      return;
    }
    element.dataset.leaving = '1';
    knockBubble();
    // Whatever it was doing, it has stopped being true — the bars and the sweeping
    // hand are claims about something that is no longer happening.
    element.classList.remove('live');
    element.style.setProperty('--split-ms', MERGE_TRAVEL + 'ms');
    element.style.setProperty('--split-delay', '0ms');
    aimHome(element);
    stirLiquid(MERGE_TRAVEL + MERGE_EXPAND + 200);
    // Nothing is left to open out around it — the bubble is going bare and staying
    // there — so the journey is the whole of it.
    if (!mergeHold) scheduleRetire(MERGE_TRAVEL);
  }

  /**
   * The bubble taking a circle in. It is the same knock whatever sent the circle home —
   * a mod ending, or the Now bubble coming out and leaving the row room for one circle
   * instead of two — because to the bubble it is the same event: something ran into it.
   */
  function knockBubble() {
    pill.classList.remove('knocked');
    void pill.offsetWidth;
    pill.classList.add('knocked');
    stirLiquid(MERGE_TRAVEL + 460);
  }

  /** Onto the bubble's glyph slot, wherever the bubble currently has it. */
  function aimHome(element) {
    const target = glyphAligned(layout()) + 'px';
    element.style.setProperty('--sat-x', target);
    element.style.setProperty('--sat-birth', target);
  }

  /**
   * The second leg: the bubble is opening out and its glyph slot travels left with
   * its edge, so the circle still carrying that glyph travels with it, on the same
   * clock and the same curve. They arrive together because they are the same move.
   */
  function trackExpansion() {
    for (const side of ['right', 'left']) {
      const element = satellites[side];
      if (!element.dataset.leaving) continue;
      element.style.setProperty('--split-ms', MERGE_EXPAND + 'ms');
      aimHome(element);
    }
  }

  let retireTimer = null;

  function scheduleRetire(after) {
    clearTimeout(retireTimer);
    retireTimer = setTimeout(retireLeaving, after);
  }

  /** Off, on the spot, holding nothing — no journey, no retirement to wait for. */
  function dropSatellite(element) {
    element.classList.remove('showing', 'live');
    delete element.dataset.leaving;
    element.removeAttribute('style');
    delete element.dataset.mod;
    element.innerHTML = '';
  }

  /** The hand-over itself: the circle stops holding the glyph and the bubble has it. */
  function retireLeaving() {
    root.classList.remove('handing-over');
    for (const side of ['right', 'left']) {
      const element = satellites[side];
      if (!element.dataset.leaving) continue;
      dropSatellite(element);
    }
    stirLiquid(300);
  }

  /** Whatever the circle is holding: the face, its colour, and whether it is moving. */
  function dressSatellite(element, mod) {
    // Caught on its way home and sent back out: the retirement waiting for it is
    // called off, and the sweep that would have retired it skips whatever is no
    // longer marked as leaving.
    delete element.dataset.leaving;
    const fresh = element.dataset.mod !== mod;
    if (fresh) {
      element.dataset.mod = mod;
      element.innerHTML = SATELLITE_FACES[mod];
      // Brand new bars, which no swing is driving yet.
      runBars();
    }
    // The avatar is data, not markup, so it is set every paint rather than baked into
    // the face: the same circle carries whoever the call is with now.
    if (mod === 'call') {
      const avatar = element.querySelector('.sat-avatar');
      if (avatar) paintAvatar(avatar);
    }
    if (mod === 'media') {
      const art = element.querySelector('.sat-art');
      if (art && media) art.src = media.artBase64 || '';
    }
    // Its own app's colour, not the bubble's: the accent variable follows whichever
    // mod owns the bubble, and a Spotify circle beside a timer must stay green.
    element.style.setProperty('--app-accent', accentOf(mod));
    // The animation is the truth about the thing, exactly as it is in the bubble:
    // bars move while sound plays, the hand sweeps while the timer runs.
    element.classList.toggle(
      'live',
      mod === 'media' ? Boolean(media.isPlaying)
        : mod === 'timer' ? Boolean(timer.endsAt)
        : true
    );

    return fresh;
  }

  /**
   * The circle the bubble is trading width with. It is the only one that changes size
   * — it is taking what the bubble gives up — and it tracks the finger the whole way.
   */
  function paintTrader(element, mod, box) {
    const fresh = dressSatellite(element, mod);
    element.style.opacity = '';
    element.style.setProperty('--sat-width', box.sat + 'px');
    element.style.setProperty('--sat-x', box.satX + 'px');
    element.style.setProperty('--sat-birth', glyphAligned(box) + 'px');
    reveal(element, fresh);
  }

  /**
   * The circle that is not in the trade: it keeps its size, gets shoved further out as
   * the bubble arrives over it, and changes sides while it is invisible.
   */
  function paintWrapper(element, mod, box) {
    const fresh = dressSatellite(element, mod);
    element.style.opacity = root.classList.contains('dragging') ? String(box.farFade) : '';
    element.style.setProperty('--sat-width', satSize() + 'px');
    element.style.setProperty('--sat-x', box.farX + 'px');
    element.style.setProperty(
      '--sat-birth', (box.mainX - (box.edge * box.main) / 2) + 'px'
    );
    reveal(element, fresh);
  }

  /**
   * A circle that has just been given a place has to be *put* there before it is told
   * to show, or it transitions in from wherever the last one it held left it — which
   * is the width and the side of a different mod, and reads as the wrong bubble
   * sliding out of the wrong edge.
   */
  function reveal(element, fresh) {
    if (fresh) void element.offsetWidth;
    element.classList.add('showing');
  }

  /**
   * The counted rest of the row: one dot per mod, outside the circle on its side, in
   * that mod's own colour. They sit at a fixed remove from the satellite and stay
   * there through a drag — a dot is a count, and the count does not change while the
   * row rotates.
   */
  /** How many dots each side was last drawn with, so an arrival can be told from a repaint. */
  const dotsSeen = { right: 0, left: 0 };

  function paintDots(box) {
    const spread = dotted();
    for (const side of ['right', 'left']) {
      const group = dotGroups[side];
      const mods = spread[side];
      group.textContent = '';
      if (!mods.length) {
        group.classList.remove('showing');
        dotsSeen[side] = 0;
        continue;
      }
      for (const mod of mods) {
        const dot = document.createElement('span');
        dot.style.background = accentOf(mod);
        // The group is rebuilt on every paint, so a plain CSS animation on the element
        // would replay on every drag frame. Only a count that has grown is an arrival.
        if (mods.length > dotsSeen[side]) dot.classList.add('arriving');
        group.appendChild(dot);
      }
      dotsSeen[side] = mods.length;
      const edge = side === 'right' ? 1 : -1;
      const width = mods.length * DOT_SIZE + (mods.length - 1) * DOT_GAP;
      const start = box.reach + satSize() / 2 + DOT_GAP;
      group.style.setProperty(
        '--dots-x', (box.push + edge * (start + width / 2)) + 'px'
      );
      group.classList.add('showing');
    }
  }

  /**
   * The drag itself: dragging away from the satellite pulls it into the middle, the
   * way a carousel moves — the finger drags the row, not the thing it wants. The
   * bubble gives up width as the satellite takes it, live under the finger, and
   * nothing is committed until the finger lifts.
   */
  function dragSwap(travelled) {
    const live = liveMods();
    if (live.length < 2) return false;
    // Away from a satellite pulls it in. With both sides taken either one can be
    // pulled, so the finger's direction picks which — and it may change its mind, as
    // long as it comes back through the middle first.
    const towards = satSide === 'right' ? -travelled : travelled;
    let progress = swapDir > 0 ? towards : -towards;
    if (progress < 0 && live.length > 2) {
      swapDir = -swapDir;
      progress = -progress;
    }
    swap = Math.min(1, Math.max(0, progress / SWAP_DISTANCE));
    root.classList.add('dragging');
    paintSatellites();
    return swap > 0.04;
  }

  /**
   * Past halfway the satellite has earned the bubble.
   *
   * The two are drawn by different elements — one bubble, one satellite — so the
   * swap is a hand-off: each takes over exactly where the other one is, with the
   * transitions still off, so not a pixel moves at the moment they change roles. The
   * satellite ends up on the side the old bubble retreated to, because that is where
   * it visibly went; sending it back across would be the jump this replaces. Only
   * then are the transitions let go, and the pair settles into rest.
   */
  function releaseSwap() {
    if (!root.classList.contains('dragging')) return;
    const committed = swap > 0.5;
    if (!committed) {
      root.classList.remove('dragging');
      swap = 0;
      swapDir = 1;
      paintSatellites();
      return;
    }

    const box = layout();
    const flanked = liveMods().length > 2;
    const dir = swapDir;
    // The side the incoming satellite is standing on, read before the commit swaps
    // the names over. With two satellites the finger picked one; with one there is
    // only the one it can be.
    enterFrom(flanked ? box.inSide : satSide);
    swap = 0;
    swapDir = 1;
    bridge.triggerHaptic('tap');
    // Set before the commit, not after: toClosed() runs inside it and repaints the
    // row on its own account, with swap already back at 0 and satSide already
    // flipped — full width, dead centre, the state the row is headed for but is
    // not at yet. That write reached the glass a beat before commitTrade or
    // commitRotation handed it the real one, and the two native layout passes
    // landed as separate frames: a flash to full width before the correct, smaller,
    // offset one took over. Flagged settling, layoutSatellites leaves the row alone
    // and only the hand-off's own numbers are ever painted.
    settling = true;
    if (flanked) commitRotation(box, dir);
    else commitTrade(box);

    // The settle is one move, not a staged pair: the hand-off already stood both
    // boxes where the finger left them, so from here they only travel to rest.
    requestAnimationFrame(() => {
      root.classList.remove('dragging');
      // Cleared *before* the paint, never after. settling exists to stop this row
      // being painted at its destination while the hand-off is still standing it
      // where the finger left it — and the hand-off is over by the time this frame
      // runs, so leaving the flag up here suppressed the one paint that was supposed
      // to carry it home. The bubble then kept the part-way width and the sideways
      // offset the release froze it at, off the cutout, until some unrelated repaint
      // — a media tick, a timer second — happened along and fixed it by accident.
      // Which is exactly what "it sometimes rearranges itself" was.
      settling = false;
      paintSatellites();
    });
  }

  /**
   * The row moves on by one, and only the mods that are actually true take part: a
   * mod that is not live still holds a place in the order, and rotating the whole
   * list handed the bubble to something invisible — which looked like every second
   * swipe doing nothing at all. The dead ones keep their places behind the live row,
   * so the order they come back in is the order they were in.
   */
  function rotate(dir) {
    const live = liveMods();
    if (live.length < 2) return;
    const spun = dir < 0
      ? [live[live.length - 1], ...live.slice(0, -1)]
      : [...live.slice(1), live[0]];
    modOrder = [...spun, ...modOrder.filter((mod) => !live.includes(mod))];
  }

  /**
   * One satellite: the two of them simply trade. The satellite becomes the bubble and
   * the bubble becomes the satellite, on the side it retreated to — that is visibly
   * where it went, and sending it back across would be the jump this replaces.
   *
   * They are drawn by different elements, so this is a hand-off: each takes over
   * exactly where the other one is, with the transitions still off, so not a pixel
   * moves at the moment they change roles.
   */
  function commitTrade(box) {
    rotate(1);
    satSide = otherSide(satSide);

    // Whatever picture the circle was holding has to be in the bubble's own copy of
    // it before the bubble is asked to show it. See carryArt().
    carryArt();
    // Faces and window first, while nothing can animate.
    toClosed();

    root.style.setProperty('--main-width', box.sat + 'px');
    root.style.setProperty('--shift', box.satX + 'px');
    const arriving = satellites[satSide];
    arriving.style.setProperty('--sat-x', box.mainX + 'px');
    arriving.style.setProperty('--sat-width', box.main + 'px');

    // The two of them have traded names, so the glass trades with them: the bubble's
    // pane is now the small one out at the side, and the satellite's is the wide one
    // in the middle. Both stand exactly where they already are.
    paintBlur({
      width: box.sat, mainX: box.satX, sat: box.main, satX: box.mainX,
      farFade: box.farFade, farX: box.farX,
    });
  }

  /**
   * Two satellites: the sides are fixed and the row rotates through them. Which way it
   * rotates is which circle the finger pulled — the one being pulled in takes the
   * middle, the bubble takes the slot opposite it, and the third has already crossed
   * over while it was invisible.
   */
  function commitRotation(box, dir) {
    rotate(dir);

    carryArt();
    toClosed();

    root.style.setProperty('--main-width', box.sat + 'px');
    root.style.setProperty('--shift', box.satX + 'px');
    // The bubble became the circle opposite the one it handed over to, and it is
    // already standing there — still at the width it shrank to, which is what it goes
    // on settling from.
    const stepped = satellites[otherSide(box.inSide)];
    stepped.style.setProperty('--sat-x', box.mainX + 'px');
    stepped.style.setProperty('--sat-width', box.main + 'px');
    // The one that crossed is already drawn on this side, mid fade-in.
    satellites[box.inSide].style.setProperty('--sat-x', (box.edge * box.reach) + 'px');

    // And the glass goes with them, unmoved, for the same reason it does in a trade.
    paintBlur({
      width: box.sat, mainX: box.satX, sat: box.main, satX: box.mainX,
      farFade: box.farFade, farX: box.farX,
    });
  }


  /** What the window is showing right now, in the same units the sizes are given in. */
  let windowWidth = compact.width;
  let deferredTarget = null;

  function applyWindow(target) {
    windowWidth = target.width < 0 ? compact.width : target.width;
    bridge.setWindowBounds(
      target.width, target.height, target.rise || 0, Math.round(target.shift || 0)
    );
  }

  /** The window every size wants, including the closed ones the table has no row for. */
  function windowFor(next, override) {
    if (override) return override;
    if (next === 'idle') return { width: -1, height: -1 };
    if (next === 'playing') return mediaWindow();
    if (next === 'timing') return timerWindow();
    if (next === 'calling') return closedTarget();
    return SIZES[next];
  }

  /**
   * Which comes first depends on the direction, and only on that. Growing, the
   * window has to be bigger before the bubble animates into it, or the first frames
   * are clipped — that was a mod arriving into a window still the bare width, drawn
   * cut off until the resize caught up. Shrinking, the bubble has to finish first,
   * or the collapse plays against a viewport it has already outgrown.
   */
  function setSize(next, override) {
    if (size === next && !override) return;
    size = next;
    const target = windowFor(next, override);
    const width = target.width < 0 ? compact.width : target.width;

    if (width > windowWidth) {
      deferredTarget = null;
      applyWindow(target);
      afterRelayout(paintSize);
      return;
    }
    deferredTarget = target;
    paintSize();
    ensureClosedWindow();
  }

  /**
   * The window follows the bubble down at transitionend, but a state that ends
   * without a size transition — a released hold, a list closed at the same size —
   * would leave the window grown, and a grown window is dead space over the shade.
   */
  /** Back to whatever closed is right now, which under a mod is not the bare size. */
  /** The window the finished shrink was headed for, once the bubble is done moving. */
  function applyClosedWindow() {
    if (root.classList.contains('holding')) return;
    applyWindow(deferredTarget || windowFor(size));
  }

  /**
   * The transition end is the real signal, but a state can end at the size it began
   * at — a released hold, a list closed at the same size — and then no transition
   * ever fires. This is the floor under that.
   */
  function ensureClosedWindow() {
    clearTimeout(restoreTimer);
    // Past the longest thing that can still be moving: a satellite running home
    // takes its own split, and the bubble only starts opening out after it.
    restoreTimer = setTimeout(applyClosedWindow, MERGE_TRAVEL + MERGE_EXPAND + 320);
  }

  /** Which mod the closed bubble was carrying the last time it settled. */
  let lastOwner = null;

  /** What closed looks like under each mod: what to paint, wear and grow to. */
  const MOD_CLOSED = {

    timer: { paint: () => paintTimer(), face: 'timer', size: 'timing', room: timerWindow },
    media: { paint: () => paintMedia(), face: 'media', size: 'playing', room: mediaWindow },
    call: { paint: () => paintCall(), face: 'call', size: 'calling', room: closedTarget },
  };

  /**
   * Which side the mod is arriving from, which decides how its glyph gets there.
   *
   * 'hole' is a mod taking a bare bubble: it comes up out of the middle, because that
   * is the punch hole and everything here is born there. A side is a mod arriving off a
   * swipe, which did not come from the middle at all — it came from the satellite the
   * finger pulled in, so it is knocked on from where it already stands and the side
   * says which way.
   */
  let enterSide = 'hole';
  function enterFrom(side) {
    enterSide = side;
  }

  /** Plays the glyph's arrival: up out of the middle and onto the left. */
  function flyGlyphIn(name) {
    const glyph = faces[name] && faces[name].querySelector('.glyph');
    if (!glyph) return;
    glyph.classList.remove('entering', 'bumping');
    // Without this the class is added in the same frame it was removed and the
    // animation is never restarted — the glyph simply appears where it lands.
    void glyph.offsetWidth;
    if (enterSide === 'hole') {
      glyph.classList.add('entering');
      return;
    }
    glyph.style.setProperty('--bump', (enterSide === 'left' ? 14 : -14) + 'px');
    glyph.classList.add('bumping');
  }

  /**
   * The room the bubble is going to need, asked for while it is still bare. The
   * window is the one thing here that cannot be animated: it is resized by the host
   * a frame or two after being asked, and a resize landing in the middle of the
   * growth clips it — the bubble is drawn cut off, then catches up, which is
   * exactly what the last of the lag was. Asked for early it is simply already
   * there, and the growth is nothing but CSS from then on.
   *
   * A window wider than the bubble costs shade pixels at the top of the screen, so
   * it is only ever early by the length of one hand-over.
   */
  function claimRoom(owner) {
    const held = mergeHold;
    mergeHold = false;
    const room = MOD_CLOSED[owner].room();
    mergeHold = held;
    if ((room.width < 0 ? compact.width : room.width) > windowWidth) applyWindow(room);
  }

  /**
   * The gap between the glyph arriving at the bubble's edge and the bubble opening
   * out around it. Nothing else happens in it: this *is* the reason the bubble
   * changes width, and a reason has to be seen before the thing it causes.
   */
  function handOver(after) {
    clearTimeout(mergeTimer);
    mergeTimer = setTimeout(() => {
      mergeHold = false;
      root.classList.remove('entering');
      // Opened or taken over while the glyph was on its way: whatever is showing now
      // is the user's own doing, and it will ask for closed again itself.
      if (state !== 'idle') return;
      // A circle still holding the glyph has to keep holding it until the bubble has
      // finished arriving around it, or the picture is drawn twice in the meantime.
      const carried = ['right', 'left'].some(side => satellites[side].dataset.leaving);
      takingIn = true;
      if (carried) root.classList.add('handing-over');
      toClosed();
      if (carried) {
        trackExpansion();
        scheduleRetire(MERGE_EXPAND);
      }
      takingIn = false;
    }, after);
  }

  /**
   * Resting is whatever is true when nothing is happening: the bare bubble, or —
   * while something is playing — the song. An alert is a visitor; this is what it
   * returns to.
   *
   * A mod arriving or leaving is two beats, never one. The glyph moves first — in
   * from the middle, or in from the circle it had split off into — and only once it
   * is standing at the bubble's left edge does the bubble open out around it. The
   * width is the consequence; the glyph is the cause. Played together, as it was,
   * there is nothing to see but a box changing size for no stated reason.
   */
  function toClosed() {
    clearTimeout(dwellTimer);
    // Already mid-hand-over, and bare on purpose. Whatever has changed underneath
    // will be read again when the glyph lands.
    if (mergeHold && !takingIn) return;
    state = 'idle';
    current = null;
    pill.classList.remove('alert', 'with-image', 'charging');

    const live = liveMods();
    const owner = live[0] || null;
    const settling = takingIn;

    // A mod stopped being true and another is still standing. The one that ended
    // closes — face off, back to the bare closed bubble — and the one left over is
    // a circle out at the side, which then runs in and makes it a mod bubble again.
    if (!settling && owner && live.length < lastLive) {
      mergeHold = true;
      paintSatellites();
      showFace('idle');
      root.style.removeProperty('--app-accent');
      setSize('idle');
      claimRoom(owner);
      handOver(MERGE_TRAVEL * LAND);
      return;
    }

    // A mod taking a bare bubble. There is no circle to bring the glyph, so the
    // glyph brings itself: out of the middle, where it clears the camera hole, and
    // over to the left where the bubble will grow from.
    if (!settling && owner && owner !== lastOwner && live.length === 1) {
      mergeHold = true;
      paintSatellites();
      MOD_CLOSED[owner].paint();
      showFace(MOD_CLOSED[owner].face);
      root.classList.add('entering');
      // No satellite brought this one, so it comes up out of the middle: the punch
      // hole, which is where everything on this screen is born.
      enterFrom('hole');
      flyGlyphIn(MOD_CLOSED[owner].face);
      setSize(MOD_CLOSED[owner].size, { width: -1, height: -1, shift: 0 }, true);
      claimRoom(owner);
      handOver(MOD_ENTER * LAND);
      return;
    }

    mergeHold = false;

    // Closed mods are additive, so this is where they are asked, in order, what
    // closed looks like right now. Whichever mod leads the order owns the bubble;
    // the rest split off it as satellites, which have to be laid out before the
    // window is asked for, since they are what makes it wider.
    paintSatellites();

    if (owner) {
      const mod = MOD_CLOSED[owner];
      mod.paint();
      showFace(mod.face);
      // The bubble changing hands while it is already a mod bubble: no room is being
      // asked for, so there is only the glyph to swap, and it arrives the same way.
      if (!settling && owner !== lastOwner) flyGlyphIn(mod.face);
      setSize(mod.size, mod.room(), true);
      lastOwner = owner;
      return;
    }

    lastOwner = null;
    ensureClosedWindow();
    setSize('idle');
    showFace('idle');
    root.style.removeProperty('--app-accent');
  }

  // #region ── notifications ──────────────────────────────────────────────────

  /**
   * The words worth picking out of a message at a glance: what kind of thing it is,
   * rather than what it says. A notification is read in the half-second it is on
   * screen, and "Reel" or "Voice message" tells you whether it is worth opening
   * before any of the words around it do.
   *
   * Deliberately short and deliberately nouns. Every word added here is a word that
   * lights up in someone's actual message the moment they happen to type it, so a
   * common verb belongs nowhere near this list.
   */
  const KEYWORDS = [
    'reel', 'reels', 'story', 'stories', 'post', 'live',
    'photo', 'video', 'gif', 'sticker', 'voice message', 'audio',
    'call', 'missed call', 'attachment', 'document', 'location',
    'poll', 'event', 'invite', 'mention', 'reply', 'reaction',
    'foto', 'sprachnachricht', 'anruf', 'umfrage', 'einladung',
  ];

  const LINK_PATTERN = /\bhttps?:\/\/\S+|\bwww\.\S+/gi;

  /**
   * A message, with the parts of it that are not prose marked as such: links wear
   * the blue and the underline every link everywhere wears, and the handful of words
   * that say what kind of message this is take the app's own colour.
   *
   * Written by walking text nodes and replacing them, never by assigning innerHTML:
   * this string came from another app and is entirely under its control. A message
   * containing a tag would otherwise be a message that can draw in this window.
   */
  function markUp(host, message) {
    host.textContent = message;
    if (!message) return;
    paintMatches(host, LINK_PATTERN, 'link');
    // One pass over the whole list rather than one per word, so the earliest match in
    // the message wins rather than the earliest word in the list.
    const words = KEYWORDS
      .map(word => word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
      .join('|');
    paintMatches(host, new RegExp('\\b(?:' + words + ')\\b', 'gi'), 'keyword');
  }

  function paintMatches(host, pattern, className) {
    // Collected first: replacing a node while walking the live list skips whatever
    // came after it.
    const texts = [];
    const walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) texts.push(walker.currentNode);

    for (const node of texts) {
      const value = node.nodeValue;
      pattern.lastIndex = 0;
      if (!pattern.test(value)) continue;
      pattern.lastIndex = 0;
      const pieces = document.createDocumentFragment();
      let at = 0;
      let found;
      while ((found = pattern.exec(value)) !== null) {
        if (found.index > at) {
          pieces.appendChild(document.createTextNode(value.slice(at, found.index)));
        }
        const mark = document.createElement('span');
        mark.className = className;
        mark.textContent = found[0];
        pieces.appendChild(mark);
        at = found.index + found[0].length;
      }
      if (at < value.length) pieces.appendChild(document.createTextNode(value.slice(at)));
      node.parentNode.replaceChild(pieces, node);
    }
  }

  function show(notification) {
    clearTimeout(dwellTimer);
    state = 'alert';
    current = notification;

    document.getElementById('app-name').textContent = notification.appName || '';
    document.getElementById('title').textContent = notification.title || '';
    markUp(document.getElementById('text'), notification.text || '');
    document.documentElement.style.setProperty(
      '--app-accent', notification.accent || '#ffffff'
    );

    const icon = document.getElementById('icon');
    icon.classList.toggle('present', Boolean(notification.iconBase64));
    if (notification.iconBase64) icon.src = notification.iconBase64;

    const picture = document.getElementById('picture');
    const hasImage = Boolean(notification.imageBase64);
    pill.classList.toggle('with-image', hasImage);
    if (hasImage) picture.src = notification.imageBase64;

    showFace('alert');
    pill.classList.add('alert');
    setSize(hasImage ? 'image' : 'alert');
    bridge.triggerHaptic('notification');

    dwellTimer = setTimeout(toClosed, DWELL);
  }

  /**
   * Taken back. A notification killer works by cancelling what it does not like, and
   * it can be a fraction of a second slower than the announcement is — so whatever
   * the bubble is showing stops being true the moment the shade stops holding it.
   * An open panel is the user's own doing and is left alone.
   */
  window.onNotificationGone = key => {
    if (state === 'alert' && current && current.key === key) toClosed();
  };

  /** The picture opens to its own shape, never to a fixed box that crops it. */
  function openPicture() {
    const picture = document.getElementById('picture');
    const ratio = picture.naturalHeight / (picture.naturalWidth || 1);
    const height = Math.min(PICTURE_MAX_HEIGHT, Math.round(340 * ratio) + 64);
    document.documentElement.style.setProperty('--picture-height', height + 'px');
    setSize('picture', { width: 340, height });
  }

  function openCurrent() {
    if (current && current.key) bridge.openNotification(current.key);
    bridge.triggerHaptic('tap');
    toClosed();
  }

  // #endregion ────────────────────────────────────────────────────────────────
  // #region ── battery ────────────────────────────────────────────────────────

  /** Long enough to look at, short enough that it is over before it is in the way. */
  const BATTERY_DWELL = 4200;

  const BATTERY_COLOURS = {
    low: '#ffb300',
    critical: '#ff3b30',
    charging: '#5bfd5b',
  };

  /**
   * A battery event, shown once. It borrows the alert's state rather than becoming a
   * mod of its own: it is news, it dwells, and then the bubble goes back to whatever
   * was true before it — a song, a timer, or nothing.
   */
  window.onBattery = payload => {
    if (!payload) return;
    clearTimeout(dwellTimer);
    state = 'alert';
    // Nothing to open: the tap on this one only sends it away.
    current = null;
    pill.classList.remove('alert', 'with-image');

    const level = Math.max(0, Math.min(100, Number(payload.level) || 0));
    root.style.setProperty('--app-accent', BATTERY_COLOURS[payload.state] || BATTERY_COLOURS.low);
    // Never below a sliver: a battery drawn as empty says the phone is off.
    root.style.setProperty('--battery-level', Math.max(8, level) + '%');
    document.getElementById('battery-reading').textContent =
      payload.state === 'charging' ? 'Charging · ' + level + ' %' : level + ' %';

    showFace('battery');
    setSize('battery');
    // The class carries the animation, and it is set after the face so the fill
    // starts its run from the level this event actually arrived with.
    pill.classList.toggle('charging', payload.state === 'charging');
    bridge.triggerHaptic('notification');

    dwellTimer = setTimeout(toClosed, BATTERY_DWELL);
  };

  // #endregion ────────────────────────────────────────────────────────────────
  // #region ── media ──────────────────────────────────────────────────────────

  const playerElapsed = document.getElementById('player-elapsed');
  const playerPosition = document.getElementById('player-position');

  /** Wide enough for the art and the indicator either side of the closed bubble. */
  function mediaWindow() {
    return closedTarget();
  }

  function clock(milliseconds) {
    const total = Math.max(0, Math.round(milliseconds / 1000));
    return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
  }

  const mediaArt = document.getElementById('media-art');
  const playerArt = document.getElementById('player-art');
  let shownArt = null;

  /**
   * The cover changes over rather than being replaced. Assigning a new src paints
   * the browser's own broken-image glyph for a frame or two while the data URI is
   * decoded — that is the "img" box — and a player that has not published its art
   * yet hands over its app icon, which then flicks to the real cover a moment later.
   * So the new art is decoded off-screen first, and only a picture that is actually
   * ready gets to slide in: out to the left with a fade, in from the left with one.
   */
  function paintArt(art) {
    if (art === shownArt) return;
    shownArt = art;
    if (!art) {
      mediaArt.classList.add('hidden-art');
      playerArt.classList.add('hidden-art');
      return;
    }
    const decoded = new Image();
    decoded.src = art;
    // decode() rather than onload: onload fires when the bytes are in, and the actual
    // decode then happens synchronously on the main thread at the first paint of the
    // new src — in the middle of the slide, which is exactly where the stutter was.
    // This does it off-thread and hands back a picture that is ready to be drawn.
    const ready = decoded.decode
      ? decoded.decode().catch(() => {})
      : new Promise(done => { decoded.onload = done; });
    ready.then(() => {
      // Still the art we were asked for? A fast skip can land two of these.
      if (shownArt !== art) return;
      // The open player's cover is ten times the area of the closed one, and the
      // same 220ms that reads as a change over there reads as a flicker here.
      swapArt(mediaArt, art, 220);
      swapArt(playerArt, art, 420);
    });
  }

  /**
   * The same picture, moved into the bubble's own copy without a slide.
   *
   * A swap hands the bubble to whatever the satellite was carrying, and for media
   * that picture is already on screen — in the circle. It has to be in the bubble's
   * own <img> before that face is shown, because the two are different elements and
   * only one of them is drawing at a time. It was not: `shownArt` records what the
   * page last *asked* for, and a satellite's art is set straight onto its own element
   * without going through here, so the bubble's copy could be stale or still hidden
   * while shownArt claimed it was current. paintArt() then skipped, the face was
   * shown, and the picture had to be fetched and painted after the fact — which is
   * the flicker that read as the image re-rendering at the moment of the swap.
   *
   * No slide, deliberately: a swap is the same song arriving in a different box, and
   * a picture that slides out and back would say the song had changed.
   */
  function carryArt() {
    const art = (media && media.artBase64) || '';
    shownArt = art;
    if (!art) return;
    for (const element of [mediaArt, playerArt]) {
      element.classList.remove('leaving-art', 'entering-art', 'hidden-art');
      if (element.getAttribute('src') !== art) element.src = art;
    }
  }

  /** Out to the left, back in from the left, at whatever pace suits the size. */
  function swapArt(element, art, milliseconds) {
    element.style.transitionDuration = milliseconds + 'ms';
    element.classList.add('leaving-art');
    setTimeout(() => {
      element.src = art;
      element.classList.remove('hidden-art', 'leaving-art');
      element.classList.add('entering-art');
      requestAnimationFrame(() => element.classList.remove('entering-art'));
    }, milliseconds);
  }

  function paintMedia() {
    if (!media || isScrubbing) return;
    document.documentElement.style.setProperty(
      '--app-accent', media.accent || 'var(--section-color)'
    );
    pill.classList.toggle('sounding', Boolean(media.isPlaying));

    paintArt(media.artBase64 || '');
    document.getElementById('player-title').textContent = media.title || '';
    document.getElementById('player-artist').textContent = media.artist || '';
    document.getElementById('player-duration').textContent = clock(media.duration || 0);
    document.getElementById('player-play-path').setAttribute(
      'd', media.isPlaying ? 'M7 5h3v14H7zm7 0h3v14h-3z' : 'M8 5v14l11-7z'
    );
    paintProgress(media.position || 0);
  }

  // What the bar is currently showing, which is where a relative drag starts from.
  let shownPosition = 0;

  function paintProgress(position) {
    shownPosition = position;
    const duration = (media && media.duration) || 0;
    const ratio = duration > 0 ? Math.min(1, position / duration) : 0;
    playerElapsed.style.width = (ratio * 100) + '%';
    playerPosition.textContent = clock(position);
  }

  /**
   * The session only reports a position when something changes, so the seconds in
   * between are counted here rather than asked for sixty times a minute.
   */
  function runMediaClock(from) {
    clearInterval(mediaTicker);
    if (!media || !media.isPlaying) return;
    let position = from === undefined ? (media.position || 0) : from;
    mediaTicker = setInterval(() => {
      if (size !== 'player' || isScrubbing) return;
      position += 500;
      paintProgress(position);
    }, 500);
  }

  window.onMediaUpdate = payload => {
    media = payload;
    if (!media) {
      mods.delete('media');
      clearInterval(mediaTicker);
      pill.classList.remove('sounding');
      if (state === 'idle') toClosed();
      return;
    }
    mods.add('media');
    paintMedia();
    runMediaClock();
    runBars();
    // A song that starts while an alert is showing waits its turn; the alert
    // returns to it on its own.
    if (state === 'idle') toClosed();
  };

  /**
   * The three bars, one swing at a time. Music is not periodic, so an indicator that
   * is says "animation" rather than "sound" — every swing gets its own reach and its
   * own pace.
   *
   * Driven from script rather than by a CSS animation over custom properties: those
   * keyframes re-read the properties on every frame, so a fresh pair of heights
   * landed in the middle of a swing and the bar jumped to it. Here a swing is an
   * animation of its own, from the height the last one ended on to a new top and
   * down to a new bottom, and the next one is only rolled when it has finished.
   */
  const BARS = '#equalizer span, .sat-bars span';

  /** Bumped to stop the bars: every swing checks it before scheduling the next. */
  let barRun = 0;

  function pulse(bar, from, run) {
    const high = 62 + Math.random() * 38;
    // A band that drops out for one swing is what a real meter does; it stays in the
    // cycle, so it is back on the next one.
    const low = 18 + Math.random() * 26;
    const top = Math.random() < 0.2 ? low + 8 : high;
    const swing = bar.animate(
      [{ height: from + '%' }, { height: top + '%' }, { height: low + '%' }],
      { duration: 500 + Math.random() * 750, easing: 'ease-in-out' }
    );
    swing.onfinish = () => {
      if (run !== barRun || !bar.isConnected) return;
      bar.style.height = low + '%';
      pulse(bar, low, run);
    };
  }

  /**
   * Restarted rather than resumed: the satellite's bars are written into the page
   * long after the bubble's, so every caller that can have changed which bars exist
   * calls this and the whole set is put back in motion.
   */
  function runBars() {
    barRun += 1;
    const run = barRun;
    // Silence is a state of its own and it should look like one: the bars stop where
    // the sound did otherwise, at whatever height the last swing happened to reach.
    // Pulled down to their own width, so three bars become three dots.
    if (!media || !media.isPlaying) {
      document.querySelectorAll(BARS).forEach(bar => {
        bar.getAnimations().forEach(existing => existing.cancel());
        bar.animate(
          [{ height: bar.getBoundingClientRect().height + 'px' }, { height: '3px' }],
          { duration: 260, easing: 'ease-out' }
        );
        bar.style.height = '3px';
      });
      return;
    }
    document.querySelectorAll(BARS).forEach(bar => {
      bar.getAnimations().forEach(existing => existing.cancel());
      pulse(bar, parseFloat(bar.style.height) || 40, run);
    });
  }

  function openPlayer() {
    state = 'active';
    paintMedia();
    showFace('player');
    setSize('player');
    // Asked for rather than remembered: the payload's position is from whenever the
    // session last reported one, which can be minutes ago, and the timeline drew that
    // stale value until the next tick corrected it — right as the bubble finished
    // opening, which is what made it look like the animation was doing it.
    const now = Number(bridge.readMediaPosition());
    const position = Number.isFinite(now) && now > 0 ? now : (media.position || 0);
    paintProgress(position);
    runMediaClock(position);
  }

  function transport(id, action) {
    document.getElementById(id).addEventListener('click', event => {
      event.stopPropagation();
      bridge.triggerHaptic('tap');
      bridge.mediaControl(action);
    });
  }

  transport('player-previous', 'previous');
  transport('player-next', 'next');

  document.getElementById('player-play').addEventListener('click', event => {
    event.stopPropagation();
    bridge.triggerHaptic('tap');
    bridge.mediaControl(media && media.isPlaying ? 'pause' : 'play');
  });

  /**
   * Scrubbing follows the finger. The seek itself is sent once, on release — asking
   * a player to jump sixty times a second makes it stutter and fight back — but the
   * bar and the clock move the whole way, so the position under the thumb is the
   * position being chosen.
   */
  const playerTimeline = document.getElementById('player-timeline');
  const playerTrack = document.getElementById('player-track');

  /**
   * The drag is relative: it moves the position by however far the finger travels,
   * starting from where the song actually is. Jumping to wherever the thumb first
   * landed would throw away the place you were trying to adjust, and a thumb is
   * wider than the seconds it is aiming at.
   */
  let scrubOrigin = 0;
  let scrubStart = 0;

  function scrubBy(clientX) {
    const box = playerTrack.getBoundingClientRect();
    const travelled = ((clientX - scrubOrigin) / box.width) * media.duration;
    return Math.min(media.duration, Math.max(0, Math.round(scrubStart + travelled)));
  }

  playerTimeline.addEventListener('touchstart', event => {
    if (!media || !media.duration) return;
    isScrubbing = true;
    playerTimeline.classList.add('scrubbing');
    scrubOrigin = event.touches[0].clientX;
    scrubStart = shownPosition;
    scrubPosition = shownPosition;
  }, { passive: true });

  playerTimeline.addEventListener('touchmove', event => {
    if (!isScrubbing) return;
    scrubPosition = scrubBy(event.touches[0].clientX);
    paintProgress(scrubPosition);
  }, { passive: true });

  playerTimeline.addEventListener('touchend', () => {
    if (!isScrubbing) return;
    isScrubbing = false;
    playerTimeline.classList.remove('scrubbing');
    bridge.triggerHaptic('tap');
    bridge.mediaSeek(String(scrubPosition));
  }, { passive: true });

  // A cancelled touch never gets a touchend, and a bar left twice as tall would
  // claim a drag that is over.
  playerTimeline.addEventListener('touchcancel', () => {
    isScrubbing = false;
    playerTimeline.classList.remove('scrubbing');
  }, { passive: true });

  // The tap on the timeline is a seek, not a tap on the player behind it.
  playerTimeline.addEventListener('click', event => event.stopPropagation());

  // #endregion ────────────────────────────────────────────────────────────────
  // #region ── timer ──────────────────────────────────────────────────────────

  const timerRemaining = document.getElementById('timer-remaining');
  const timerClock = document.getElementById('timer-clock');

  /** Wide enough for the glyph and the reading either side of the closed bubble. */
  function timerWindow() {
    return closedTarget();
  }

  /**
   * One UI hands over a target wall-clock time, not a countdown, so the seconds are
   * counted here — the notification is only re-posted when the timer is touched, and
   * a reading that only moved then would sit frozen on screen.
   */
  function remainingText() {
    if (!timer) return '';
    // A pause changes what the reading does, not what it is: the same clock, held
    // still. The summary it leaves behind — "2 h, 13 min, 5 s / Angehalten" — is
    // read as a number rather than shown as a sentence, so nothing in the bubble
    // moves when a timer is paused except the hand.
    if (!timer.endsAt && !timer.remaining) {
      return (timer.summary || '').split('/')[0].trim();
    }
    const left = timer.endsAt
      ? Math.max(0, Math.round((timer.endsAt - Date.now()) / 1000))
      : Math.round(timer.remaining / 1000);
    const hours = Math.floor(left / 3600);
    const minutes = Math.floor((left % 3600) / 60);
    const seconds = left % 60;
    const pad = value => String(value).padStart(2, '0');
    return hours > 0
      ? hours + ':' + pad(minutes) + ':' + pad(seconds)
      : minutes + ':' + pad(seconds);
  }

  function paintTimer() {
    if (!timer) return;
    document.documentElement.style.setProperty(
      '--app-accent', timer.accent || 'var(--section-color)'
    );
    // A paused timer keeps its target, so it stops counting rather than lying.
    pill.classList.toggle('running', Boolean(timer.endsAt) && !timer.isPaused);
    pill.classList.toggle('paused', Boolean(timer.isPaused));
    const reading = remainingText();
    timerRemaining.textContent = reading;
    timerClock.textContent = reading;
    document.getElementById('timer-label').textContent = timer.appName || 'Clock';
  }

  function runTimerClock() {
    clearInterval(timerTicker);
    if (!timer || !timer.endsAt) return;
    timerTicker = setInterval(() => {
      if (!timer) return;
      const reading = remainingText();
      timerRemaining.textContent = reading;
      timerClock.textContent = reading;
    }, 1000);
  }

  /** The clock app's own buttons — pause, resume, cancel — fired from the bubble. */
  function openTimer() {
    state = 'active';
    paintTimer();

    const actions = document.getElementById('timer-actions');
    actions.textContent = '';
    for (const action of (timer && timer.actions) || []) {
      const button = document.createElement('div');
      button.className = 'timer-button';
      button.textContent = action.title;
      button.addEventListener('click', event => {
        event.stopPropagation();
        bridge.triggerHaptic('tap');
        bridge.timerAction(action.index);
        toClosed();
      });
      actions.appendChild(button);
    }

    showFace('timerPanel');
    setSize('timer');
  }

  window.onTimerUpdate = payload => {
    timer = payload;
    if (!timer) {
      mods.delete('timer');
      clearInterval(timerTicker);
      pill.classList.remove('running');
      if (state === 'idle' || size === 'timer') toClosed();
      return;
    }
    mods.add('timer');
    paintTimer();
    runTimerClock();
    if (state === 'idle') toClosed();
  };

  // #endregion ────────────────────────────────────────────────────────────────
  // #region ── call ───────────────────────────────────────────────────────────

  const callAvatar = document.getElementById('call-avatar');
  const callName = document.getElementById('call-name');
  const callTime = document.getElementById('call-time');
  let callTicker = null;

  /** The handset, for a call on the line: what a phone call has looked like forever. */
  const PHONE_MARK =
    '<svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.15 15.15 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.4 11.4 0 0 0 3.57.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02z"/></svg>';

  /** Discord's own mark, for the circle it never sends a picture for. */
  const DISCORD_MARK =
    '<svg viewBox="0 0 24 24"><path d="M20.317 4.3698a19.7913 19.7913 0 0 0-4.8851-1.5152.0741.0741 0 0 0-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 0 0-.0785-.037 19.7363 19.7363 0 0 0-4.8852 1.515.0699.0699 0 0 0-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 0 0 .0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 0 0 .0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 0 0-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 0 1-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 0 1 .0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 0 1 .0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 0 1-.0066.1276 12.2986 12.2986 0 0 1-1.873.8914.0766.0766 0 0 0-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 0 0 .0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 0 0 .0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 0 0-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z"/></svg>';

  /**
   * The circle for whoever is on the other end: their picture when the notification
   * carries one, otherwise Discord's mark. The voice notification never carries one,
   * so the mark is the normal case rather than the fallback — and it says which app
   * the call is in, which is the one thing a letter could not.
   */
  function paintAvatar(element) {
    const art = (call && call.avatarBase64) || '';
    element.style.backgroundImage = art ? 'url(' + art + ')' : '';
    element.innerHTML = art ? '' : (call && call.phone ? PHONE_MARK : DISCORD_MARK);
  }

  /**
   * How long the line has been open, counted here rather than re-read: the dialer
   * posts the start once and leaves the shade to run its own chronometer, so the
   * notification says nothing new for the whole call.
   */
  function callElapsed() {
    const seconds = Math.max(0, Math.floor((Date.now() - (call.since || Date.now())) / 1000));
    const parts = [Math.floor(seconds / 60) % 60, seconds % 60];
    if (seconds >= 3600) parts.unshift(Math.floor(seconds / 3600));
    return parts
      .map((part, index) => (index ? String(part).padStart(2, '0') : String(part)))
      .join(':');
  }

  function runCallClock() {
    clearInterval(callTicker);
    if (!call || !call.phone) {
      callTime.textContent = '';
      return;
    }
    callTime.textContent = callElapsed();
    callTicker = setInterval(() => {
      if (call && call.phone) callTime.textContent = callElapsed();
    }, 1000);
  }

  function paintCall() {
    if (!call) return;
    document.documentElement.style.setProperty(
      '--app-accent', call.accent || 'var(--section-color)'
    );
    pill.classList.toggle('phone-call', Boolean(call.phone));
    paintAvatar(callAvatar);
    callName.textContent = call.name || '';
  }

  window.onCallUpdate = payload => {
    call = payload;
    if (!call) {
      mods.delete('call');
      clearInterval(callTicker);
      pill.classList.remove('phone-call');
      if (state === 'idle') toClosed();
      return;
    }
    mods.add('call');
    paintCall();
    runCallClock();
    if (state === 'idle') toClosed();
  };

  // #endregion ────────────────────────────────────────────────────────────────
  // #endregion ────────────────────────────────────────────────────────────────
  // #region ── history ────────────────────────────────────────────────────────

  /** How far a row has to travel before the release counts as "gone". */
  const SWIPE_AWAY = 90;

  /**
   * A row is dismissed the way it would be in the shade: sideways. The list scrolls
   * vertically, so the gesture only claims the touch once it has committed to the
   * horizontal — otherwise a scroll would throw notifications away.
   */
  function swipeToDismiss(row, keys) {
    let originX = 0;
    let travel = 0;
    let isHorizontal = false;

    let originY = 0;

    row.addEventListener('touchstart', event => {
      originX = event.touches[0].clientX;
      originY = event.touches[0].clientY;
      travel = 0;
      isHorizontal = false;
      row.dataset.swiped = 'false';
      row.dataset.scrolled = 'false';
      row.style.transition = 'none';
    }, { passive: true });

    row.addEventListener('touchmove', event => {
      const dx = event.touches[0].clientX - originX;
      const dy = event.touches[0].clientY - originY;
      // Scrolling the list is not choosing a row. The finger that drags this panel to
      // read further down lifts on whichever row it happened to stop over, and that
      // lift arrives as a click on it — which opened a notification nobody asked for
      // and closed the panel they were still reading. Once the finger has travelled
      // far enough to be a scroll, this row is out of the running for the rest of the
      // touch, exactly as a horizontal swipe already takes it out.
      if (Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx)) row.dataset.scrolled = 'true';
      if (!isHorizontal && Math.abs(dx) < 12) return;
      // A drag that began as a scroll stays a scroll: the list is already moving under
      // it, and taking the row sideways halfway down would be two answers to one drag.
      if (row.dataset.scrolled === 'true') return;
      isHorizontal = true;
      travel = dx;
      if (Math.abs(dx) > 12) row.dataset.swiped = 'true';
      row.style.transform = 'translateX(' + dx + 'px)';
      row.style.opacity = String(Math.max(0, 1 - Math.abs(dx) / (SWIPE_AWAY * 2)));
      dragNeighbours(row, dx);
    }, { passive: true });

    row.addEventListener('touchend', () => {
      row.style.transition = 'transform 200ms ease-out, opacity 200ms ease-out';
      if (Math.abs(travel) < SWIPE_AWAY) {
        row.style.transform = '';
        row.style.opacity = '';
        releaseNeighbours(row);
        return;
      }
      // Gone from the shade, not only from this list: this is the same act. A row is
      // a conversation, so all of it goes.
      keys.forEach(one => bridge.dismissNotification(one));
      bridge.triggerHaptic('dismiss');
      row.style.transform = 'translateX(' + (travel > 0 ? 400 : -400) + 'px)';
      row.style.opacity = '0';
      releaseNeighbours(row);
      row.addEventListener('transitionend', () => {
        // Measured while it is still in the flow: once it is out, the height it was
        // taking up is exactly the distance everything under it is about to jump.
        const gap = row.offsetHeight;
        const below = [...document.querySelectorAll('.history-row')];
        row.remove();
        closeGap(below.slice(below.indexOf(row) + 1), gap);
        // The number in the header is the notifications, not the rows they were
        // folded into, so a row takes its whole group out of the count with it.
        const left = [...document.querySelectorAll('.history-row')]
          .reduce((sum, node) => sum + Number(node.dataset.count || 1), 0);
        document.getElementById('history-count').textContent = left ? String(left) : '';
      }, { once: true });
      // A row that took the last notification with it leaves nothing to hold open.
      setTimeout(() => {
        if (size === 'history' && !document.querySelector('.history-row')) toClosed();
      }, 220);
    }, { passive: true });
  }

  /** How much of a row's travel the rows beside it are dragged along by. */
  const ROW_PULL = 0.18;

  /**
   * The rows either side leaning after the one being pulled. A list where only the
   * row under the finger moves is a list of separate cards; one where its neighbours
   * are tugged a little is a single sheet with something being drawn out of it. The
   * neighbours never take the swipe — they lean and come straight back — so the pull
   * is a fraction of the travel and it dies off with distance.
   */
  function dragNeighbours(row, dx) {
    const rows = [...document.querySelectorAll('.history-row')];
    const at = rows.indexOf(row);
    rows.forEach((other, index) => {
      if (other === row) return;
      const distance = Math.abs(index - at);
      if (distance > 2) return;
      other.style.transition = 'none';
      other.style.transform = 'translateX(' + (dx * ROW_PULL / distance).toFixed(2) + 'px)';
    });
  }

  function releaseNeighbours(row) {
    for (const other of document.querySelectorAll('.history-row')) {
      if (other === row) continue;
      other.style.transition = 'transform 260ms var(--ease-grow)';
      other.style.transform = '';
    }
  }

  /**
   * The hole a dismissed row leaves, closed by moving rather than by disappearing.
   * A row removed from the flow takes its height out of the layout in one frame and
   * everything under it is simply drawn somewhere else — which is the teleport. So
   * the rows below are first offset by exactly the height that is about to vanish,
   * putting them back where they already were, and then let go: they travel up into
   * the gap while the panel shrinks around them, and the two moves are one.
   */
  function closeGap(below, gap) {
    if (!below.length) return;
    for (const other of below) {
      other.style.transition = 'none';
      other.style.transform = 'translateY(' + gap + 'px)';
    }
    // The offset has to be a frame the browser has actually drawn, or there is
    // nothing for the rows to travel back from.
    requestAnimationFrame(() => {
      for (const other of below) {
        other.style.transition = 'transform 260ms var(--ease-grow)';
        other.style.transform = '';
      }
    });
    // The panel gives its height back on the same clock, so the list closing up and
    // the box closing around it are one move rather than two.
    if (size === 'history') setSize('history', historyWindow(), true);
  }

  /** Which open size belongs to which mod — the hold needs to know whose app to open. */
  const MOD_FACES = { player: 'media', timer: 'timer' };

  /**
   * Leaves for the app the open mod stands for. The timer goes through its own
   * notification rather than the launcher, because the clock app's intent lands on
   * the running timer instead of on whatever tab was last open.
   */
  function openMod() {
    leaveForMod(MOD_FACES[size]);
  }

  /**
   * Out to the app a mod stands for, whichever way in that app has. The timer and a
   * call go through their own notification rather than the launcher: those intents
   * land on the running timer and inside the call, where a launcher intent lands on
   * whatever tab the app was last left on.
   */
  function leaveForMod(mod) {
    if (mod === 'media') {
      if (media && media.package) bridge.openApp(media.package);
      return;
    }
    if (mod === 'timer' && timer && timer.key) bridge.openNotification(timer.key);
    if (mod === 'call' && call && call.key) bridge.openNotification(call.key);
  }

  /** The settings the bubble owns itself, rather than anything the phone sent it. */
  function openQuick() {
    state = 'active';
    showFace('quick');
    setSize('haptic');
    paintMicrophoneAccess(bridge.readMicrophoneAccess());
    flashlightSwitch.classList.toggle('on', bridge.readTorchLit());
  }

  /**
   * The list, as conversations rather than as notifications. Three messages from the
   * same person are one thing that happened, and drawn as three rows they push
   * everything else off the panel — which is the shade's own worst habit. So an app
   * and a title together make a group: the name is written once, the sender once, and
   * every line they sent underneath, in the order the shade is holding them.
   */
  function grouped(entries) {
    const groups = [];
    const byKey = new Map();
    for (const entry of entries) {
      const id = (entry.app || '') + '  ' + (entry.title || '');
      const group = byKey.get(id);
      if (group) {
        group.entries.push(entry);
        continue;
      }
      const fresh = { id, head: entry, entries: [entry] };
      byKey.set(id, fresh);
      groups.push(fresh);
    }
    return groups;
  }

  function openHistory() {
    const list = document.getElementById('history-list');
    list.textContent = '';

    const entries = JSON.parse(bridge.readHistory() || '[]');
    document.getElementById('history-count').textContent =
      entries.length ? String(entries.length) : '';
    if (entries.length === 0) {
      const empty = document.createElement('div');
      empty.id = 'history-empty';
      empty.textContent = 'Nothing waiting';
      list.appendChild(empty);
    }

    for (const group of grouped(entries)) {
      const entry = group.head;
      const row = document.createElement('div');
      row.className = 'history-row';
      // What the row is worth to the count in the header, which counts notifications
      // and not the rows they were folded into.
      row.dataset.count = String(group.entries.length);
      // A swipe throws away the conversation, not the newest line of it: the row is
      // the whole group, and leaving the rest behind would redraw it a line shorter.
      swipeToDismiss(row, group.entries.map(one => one.key));

      const mark = document.createElement('div');
      mark.className = 'history-mark';
      mark.style.background = entry.accent || '#ffffff';

      const copy = document.createElement('div');
      copy.className = 'history-copy';

      const head = document.createElement('div');
      head.className = 'history-head-row';
      const name = document.createElement('div');
      name.className = 'history-name';
      name.style.color = entry.accent || '#ffffff';
      name.textContent = entry.appName || entry.app || '';
      head.appendChild(name);
      if (group.entries.length > 1) {
        const tally = document.createElement('div');
        tally.className = 'history-tally';
        tally.textContent = group.entries.length;
        head.appendChild(tally);
      }
      copy.appendChild(head);

      // The sender, written once for the whole group rather than in front of every
      // line they sent.
      if (entry.title) {
        const who = document.createElement('div');
        who.className = 'history-who';
        who.textContent = entry.title;
        copy.appendChild(who);
      }
      // A messenger keeps its whole conversation in one notification and rewrites it
      // as each line arrives, so the lines are the messages and `text` is only the
      // last of them. Every line is drawn, oldest first, and a divider is set between
      // them: they are one conversation and stay grouped as one, but three things
      // someone said are three things, not a paragraph.
      const lines = group.entries.flatMap(one =>
        (one.lines && one.lines.length)
          ? one.lines.map(line => line.text)
          : [one.text || (entry.title ? '' : one.title || '')]
      ).filter(Boolean);
      lines.forEach((line, index) => {
        const text = document.createElement('div');
        text.className = index ? 'history-text divided' : 'history-text';
        markUp(text, line);
        copy.appendChild(text);
      });

      row.append(mark, copy);
      row.addEventListener('click', event => {
        event.stopPropagation();
        // A swipe ends in a click too, and so does a scroll; neither the row that was
        // thrown away nor the one the finger merely rested on is a row that was chosen.
        if (row.dataset.swiped === 'true' || row.dataset.scrolled === 'true') return;
        bridge.openNotification(entry.key);
        bridge.triggerHaptic('tap');
        toClosed();
      });
      list.appendChild(row);
    }

    state = 'active';
    showFace('history');
    setSize('history', historyWindow());
  }

  /**
   * As tall as the list actually is, and no taller — up to three quarters of the
   * screen, past which a panel hanging off the cutout stops reading as a bubble and
   * starts reading as a second shade. A short list gets a short panel: a fixed height
   * left two notifications sitting at the top of a box mostly full of nothing.
   *
   * Measured off the face while it is still the old size, which works because the
   * face is laid out at its final width from the first frame — see #history-face.
   */
  function historyWindow() {
    const ceiling = Math.round(screen.height * 0.75);
    const head = document.getElementById('history-head');
    const list = document.getElementById('history-list');
    // Padding of the face, top and bottom, in the same units the rest of this is in.
    const frame = 20;
    const wanted = head.offsetHeight + list.scrollHeight + frame;
    const height = Math.max(SIZES.history.height, Math.min(ceiling, wanted));
    root.style.setProperty('--history-height', height + 'px');
    return { width: SIZES.history.width, height };
  }

  // #endregion ────────────────────────────────────────────────────────────────
  // #region ── quick setting ──────────────────────────────────────────────────

  const microphoneSwitch = document.getElementById('microphone-switch');
  const flashlightSwitch = document.getElementById('flashlight-switch');

  function paintMicrophoneAccess(reading) {
    microphoneSwitch.classList.toggle('unavailable', reading === 'unavailable');
    microphoneSwitch.classList.toggle('on', reading === 'allowed');
  }

  window.onMicrophoneAccessChanged = paintMicrophoneAccess;

  microphoneSwitch.addEventListener('click', event => {
    event.stopPropagation();
    if (microphoneSwitch.classList.contains('unavailable')) return;
    const next = !microphoneSwitch.classList.contains('on');
    paintMicrophoneAccess(next ? 'allowed' : 'blocked');
    bridge.triggerHaptic('tap');
    bridge.setMicrophoneAccess(next);
  });

  /**
   * The light is not this bubble's own state — it has a window of its own out by the
   * clock — but it is a thing worth being able to reach without hunting for a tile,
   * which is what this panel is for. The switch is painted from the camera service's
   * own reading rather than from the tap, so it is right whoever lit the torch.
   */
  window.onTorchLit = isLit => flashlightSwitch.classList.toggle('on', isLit);

  flashlightSwitch.addEventListener('click', event => {
    event.stopPropagation();
    const next = !flashlightSwitch.classList.contains('on');
    flashlightSwitch.classList.toggle('on', next);
    bridge.triggerHaptic('tap');
    bridge.setTorchLit(next);
  });

  // #endregion ────────────────────────────────────────────────────────────────
  // #region ── input ──────────────────────────────────────────────────────────

  // The window shrinks back only once the collapse has finished, so the resize
  // never lands mid-frame.
  pill.addEventListener('transitionend', event => {
    if (event.propertyName !== 'height' && event.propertyName !== 'width') return;
    if (CLOSED.has(size)) applyClosedWindow();
  });

  let startY = 0;
  let startX = 0;
  let hasMoved = false;
  let hasGrown = false;
  let hasSwiped = false;

  /**
   * The window is exactly the resting bubble, so a bubble that scales past it is
   * simply clipped at the sides. It is widened by the scale factor for the duration
   * of the hold — and by no more than that, because every pixel this window covers
   * is a pixel the notification shade cannot be dragged from.
   */
  /** The window the closed bubble occupies right now — bare, or under a mod. */
  function closedWindow() {
    const live = liveMods();
    if (!live.length) return { width: compact.width, height: compact.height };
    return { width: closedTarget().width, height: compact.height };
  }

  function beginHold() {
    root.classList.add('holding');
    // The room for the scale is asked for late on purpose. Resizing the window while
    // a finger is down interrupts the gesture, and the tap that follows is lost —
    // that is what made a closed mod need several taps to open. A tap is over long
    // before this fires; only a real hold ever gets here.
    clearTimeout(growTimer);
    growTimer = setTimeout(() => {
      // Scaled from whatever the bubble currently is, never from the bare size: a
      // mod makes the closed bubble wider.
      const base = closedWindow();
      // Only the bubble scales, so only the bubble's share of the window needs the
      // extra room. Scaling the whole width would pad it by the satellites' width
      // as well — dead pixels over the shade, for a growth that never reaches them.
      const main = closedTarget().main || compact.width;
      hasGrown = true;
      applyWindow({
        width: Math.ceil(base.width + main * (HOLD_SCALE - 1)) + 2,
        height: Math.ceil(base.height * HOLD_SCALE) + 2,
      });
    }, HOLD_GRACE);
  }

  function endHold() {
    clearTimeout(holdTimer);
    root.classList.remove('pressing');
    clearTimeout(growTimer);
    hasGrown = false;
    // A hold released before it opened anything leaves the bubble where it began.
    if (state === 'haptic' && !hasHeld) state = 'idle';
    if (!root.classList.contains('holding')) return;
    root.classList.remove('holding');
    ensureClosedWindow();
  }

  pill.addEventListener('touchstart', event => {
    startY = event.touches[0].clientY;
    startX = event.touches[0].clientX;
    hasMoved = false;
    hasHeld = false;
    hasGrown = false;
    hasSwiped = false;

    if (state === 'idle') {
      state = 'haptic';
      beginHold();
      holdTimer = setTimeout(() => {
        hasHeld = true;
        root.classList.remove('holding');
        bridge.triggerHaptic('expand');
        // The hold on a mod is the way out to its app — the one thing the bubble
        // itself can never be. A bare bubble has no app to leave for, so it holds to
        // the settings it owns; a call taps out to Discord already, so it does too.
        const held = liveMods()[0];
        if (!held || held === 'call') {
          openQuick();
          return;
        }
        leaveForMod(held);
        toClosed();
      }, HOLD_MILLIS);
      return;
    }

    // An open mod holds too, and it means the one thing the panel cannot do: leave
    // for the app itself. No growth under the finger for this one — the window is
    // already exactly the open bubble, so a scale would only be clipped by it.
    if (state === 'active' && MOD_FACES[size]) {
      root.classList.add('pressing');
      holdTimer = setTimeout(() => {
        hasHeld = true;
        root.classList.remove('pressing');
        bridge.triggerHaptic('expand');
        openMod();
        toClosed();
      }, HOLD_MILLIS);
    }
  }, { passive: true });

  pill.addEventListener('touchmove', event => {
    // The haptic has fired: it has already opened a panel or left for an app, and it
    // owns the rest of this touch outright. Nothing below may read the same finger —
    // a pull or a sideways trade running on top of what the hold just did is two
    // gestures answering one touch, and the second one undoes the first. The finger
    // has to be lifted before anything else may be asked for.
    if (hasHeld) return;
    const verticalTravel = event.touches[0].clientY - startY;
    const horizontalTravel = Math.abs(event.touches[0].clientX - startX);
    // A finger held still for a third of a second still wanders. One slop for both
    // answers: whatever cancels the hold is the same travel that starts the drag, so
    // there is no band where the bubble is being dragged and the hold has been
    // called off but nothing has been asked for yet.
    if (Math.abs(verticalTravel) > HOLD_SLOP || horizontalTravel > HOLD_SLOP) endHold();
