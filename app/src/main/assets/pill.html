        markUp(text, line);
        copy.appendChild(text);
      });

      row.append(mark, copy);
      row.addEventListener('click', event => {
        event.stopPropagation();
        // A swipe ends in a click too, and so does a scroll; neither the row that was
        // thrown away nor the one the finger merely rested on is a row that was chosen.
        if (row.dataset.swiped === 'true' || row.dataset.scrolled === 'true') return;
        bridge.openNotification(entry.key);
        bridge.triggerHaptic('tap');
        toClosed();
      });
      list.appendChild(row);
    }

    state = 'active';
    showFace('history');
    setSize('history', historyWindow());
  }

  /**
   * As tall as the list actually is, and no taller — up to three quarters of the
   * screen, past which a panel hanging off the cutout stops reading as a bubble and
   * starts reading as a second shade. A short list gets a short panel: a fixed height
   * left two notifications sitting at the top of a box mostly full of nothing.
   *
   * Measured off the face while it is still the old size, which works because the
   * face is laid out at its final width from the first frame — see #history-face.
   */
  function historyWindow() {
    const ceiling = Math.round(screen.height * 0.75);
    const head = document.getElementById('history-head');
    const list = document.getElementById('history-list');
    // Padding of the face, top and bottom, in the same units the rest of this is in.
    const frame = 20;
    const wanted = head.offsetHeight + list.scrollHeight + frame;
    const height = Math.max(SIZES.history.height, Math.min(ceiling, wanted));
    root.style.setProperty('--history-height', height + 'px');
    return { width: SIZES.history.width, height };
  }

  // #endregion ────────────────────────────────────────────────────────────────
  // #region ── quick setting ──────────────────────────────────────────────────

  const microphoneSwitch = document.getElementById('microphone-switch');
  const flashlightSwitch = document.getElementById('flashlight-switch');

  function paintMicrophoneAccess(reading) {
    microphoneSwitch.classList.toggle('unavailable', reading === 'unavailable');
    microphoneSwitch.classList.toggle('on', reading === 'allowed');
  }

  window.onMicrophoneAccessChanged = paintMicrophoneAccess;

  microphoneSwitch.addEventListener('click', event => {
    event.stopPropagation();
    if (microphoneSwitch.classList.contains('unavailable')) return;
    const next = !microphoneSwitch.classList.contains('on');
    paintMicrophoneAccess(next ? 'allowed' : 'blocked');
    bridge.triggerHaptic('tap');
    bridge.setMicrophoneAccess(next);
  });

  /**
   * The light is not this bubble's own state — it has a window of its own out by the
   * clock — but it is a thing worth being able to reach without hunting for a tile,
   * which is what this panel is for. The switch is painted from the camera service's
   * own reading rather than from the tap, so it is right whoever lit the torch.
   */
  window.onTorchLit = isLit => flashlightSwitch.classList.toggle('on', isLit);

  flashlightSwitch.addEventListener('click', event => {
    event.stopPropagation();
    const next = !flashlightSwitch.classList.contains('on');
    flashlightSwitch.classList.toggle('on', next);
    bridge.triggerHaptic('tap');
    bridge.setTorchLit(next);
  });

  // #endregion ────────────────────────────────────────────────────────────────
  // #region ── input ──────────────────────────────────────────────────────────

  // The window shrinks back only once the collapse has finished, so the resize
  // never lands mid-frame.
  pill.addEventListener('transitionend', event => {
    if (event.propertyName !== 'height' && event.propertyName !== 'width') return;
    if (CLOSED.has(size)) applyClosedWindow();
  });

  let startY = 0;
  let startX = 0;
  let hasMoved = false;
  let hasGrown = false;
  let hasSwiped = false;

  /**
   * The window is exactly the resting bubble, so a bubble that scales past it is
   * simply clipped at the sides. It is widened by the scale factor for the duration
   * of the hold — and by no more than that, because every pixel this window covers
   * is a pixel the notification shade cannot be dragged from.
   */
  /** The window the closed bubble occupies right now — bare, or under a mod. */
  function closedWindow() {
    const live = liveMods();
    if (!live.length) return { width: compact.width, height: compact.height };
    return { width: closedTarget().width, height: compact.height };
  }

  function beginHold() {
    root.classList.add('holding');
    // The room for the scale is asked for late on purpose. Resizing the window while
    // a finger is down interrupts the gesture, and the tap that follows is lost —
    // that is what made a closed mod need several taps to open. A tap is over long
    // before this fires; only a real hold ever gets here.
    clearTimeout(growTimer);
    growTimer = setTimeout(() => {
      // Not while the row is being dragged. Resizing the proxy pulls the surface out
      // from under the finger and the system answers with a cancel, which would end the
      // drag the hold is deliberately running underneath. The window a closed row with
      // a satellite already has is symmetric and holds a satellite's width either side,
      // which is more than the swell needs — so the growth is simply skipped and the
      // scale is drawn in room that was already there.
      if (root.classList.contains('dragging')) return;
      // Scaled from whatever the bubble currently is, never from the bare size: a
      // mod makes the closed bubble wider.
      const base = closedWindow();
      // Only the bubble scales, so only the bubble's share of the window needs the
      // extra room. Scaling the whole width would pad it by the satellites' width
      // as well — dead pixels over the shade, for a growth that never reaches them.
      const main = closedTarget().main || compact.width;
      hasGrown = true;
      applyWindow({
        width: Math.ceil(base.width + main * (HOLD_SCALE - 1)) + 2,
        height: Math.ceil(base.height * HOLD_SCALE) + 2,
      });
    }, HOLD_GRACE);
  }

  function endHold() {
    clearTimeout(holdTimer);
    root.classList.remove('pressing');
    clearTimeout(growTimer);
    hasGrown = false;
    // A hold released before it opened anything leaves the bubble where it began.
    if (state === 'haptic' && !hasHeld) state = 'idle';
    if (!root.classList.contains('holding')) return;
    root.classList.remove('holding');
    ensureClosedWindow();
  }

  pill.addEventListener('touchstart', event => {
    startY = event.touches[0].clientY;
    startX = event.touches[0].clientX;
    hasMoved = false;
    hasHeld = false;
    hasGrown = false;
    hasSwiped = false;

    if (state === 'idle') {
      state = 'haptic';
      beginHold();
      holdTimer = setTimeout(() => {
        hasHeld = true;
        root.classList.remove('holding');
        // Whatever else the finger had started underneath the hold is let go of here,
        // and let go of without being asked what it wanted: the hold has the touch now,
        // and a trade committing or a list opening behind the panel this is about to
        // put up is two gestures answering one finger.
        abandonSwap();
        endPull();
        bridge.triggerHaptic('expand');
        // The hold on a mod is the way out to its app — the one thing the bubble
        // itself can never be. A bare bubble has no app to leave for, so it holds to
        // the settings it owns; a call taps out to Discord already, so it does too.
        const held = liveMods()[0];
        if (!held || held === 'call') {
          openQuick();
          return;
        }
        leaveForMod(held);
        toClosed();
      }, HOLD_MILLIS);
      return;
    }

    // An open mod holds too, and it means the one thing the panel cannot do: leave
    // for the app itself. No growth under the finger for this one — the window is
    // already exactly the open bubble, so a scale would only be clipped by it.
    if (state === 'active' && MOD_FACES[size]) {
      root.classList.add('pressing');
      holdTimer = setTimeout(() => {
        hasHeld = true;
        root.classList.remove('pressing');
        bridge.triggerHaptic('expand');
        openMod();
        toClosed();
      }, HOLD_MILLIS);
    }
  }, { passive: true });

  pill.addEventListener('touchmove', event => {
    // The haptic has fired: it has already opened a panel or left for an app, and it
    // owns the rest of this touch outright. Nothing below may read the same finger —
    // a pull or a sideways trade running on top of what the hold just did is two
    // gestures answering one touch, and the second one undoes the first. The finger
    // has to be lifted before anything else may be asked for.
    if (hasHeld) return;
    const verticalTravel = event.touches[0].clientY - startY;
    const horizontalTravel = Math.abs(event.touches[0].clientX - startX);
    const sideways = event.touches[0].clientX - startX;
    // Inside the dead zone nothing moves and nothing is measured. This is the room the
    // hold needs: a finger pressing for a third of a second wanders, and every pixel of
    // that wander used to reach some gesture or other.
    if (Math.hypot(horizontalTravel, verticalTravel) <= DEAD_ZONE) return;
    // Until something claims the touch the bubble simply follows the finger on its
    // band. Once a real gesture has it — a trade, a lean — the play drag lets go and
    // the row's own motion takes over, or the bubble would be carried twenty pixels off
    // its place for the whole of a swap.
    if (root.classList.contains('dragging') || root.classList.contains('pulling') ||
        hasSwiped) {
      untoy(root, '--drag');
    } else {
      toy(root, '--drag', sideways, verticalTravel);
    }
    // The hold is no longer called off by travel at all. It used to be — one slop for
    // both answers, whatever cancels the hold is the same travel that starts the drag —
    // and that made the drag the senior gesture: a finger that moved was a finger that
    // had given up on holding, so the swell stopped growing and the haptic never came.
    // It is the other way round now. The hold runs underneath whatever else the finger
    // is doing, swelling on `scale` while the drag trades width and the pull leans, and
    // if the finger is still down when its timer comes up the hold takes the touch and
    // the others are let go of without asking for anything. A gesture that has to be
    // held still to work is one the user has to be careful to make.
    // Sideways across a closed bubble trades width with the satellite, live. The
    // vertical limit only decides whether a drag may *start*: once it has, the
    // finger is free to wander down the screen, which it does — the bubble is at the
    // very top and there is nowhere else for a long drag to go.
    const dragging = root.classList.contains('dragging');
    // The pull down comes before the sideways trade, and wins whenever the finger is
    // going down more than it is going across. It is the fallback gesture, so it must
    // be the easy one to make: no aiming, and it starts moving almost at once.
    // Once it has started it keeps the touch until the finger lifts. A pull is now long
    // enough that the finger wanders well past the drag's slop sideways on the way
    // down, and the frame where that wander read as wider than the travel handed the
    // touch to the sideways trade — which sets hasSwiped and kills the pull for good.
    // The direction only decides which gesture this is, and it is decided once.
    const pulling = root.classList.contains('pulling');
    if (state !== 'active' && CLOSED.has(size) && !hasSwiped && !dragging &&
        (pulling || (verticalTravel > PULL_START && verticalTravel > horizontalTravel))) {
      // The hold is not called off while the bubble is merely leaning: the finger that
      // is about to be held still wanders a few pixels, and cancelling on that wander
      // is exactly what broke the hold on the sideways drag. Only a pull that has
      // actually asked for something takes the touch away from it.
      if (verticalTravel >= PULL_TRIGGER) {
        hasMoved = true;
        endHold();
        endPull();
        bridge.triggerHaptic('expand');
        openHistory();
        return;
      }
      // Clamped low because the latch above lets the finger come back up without
      // handing the touch on, and a negative reach would push the bubble upwards.
      const reached = Math.max(0, (verticalTravel - PULL_START) / (PULL_TRIGGER - PULL_START));
      pullReach = reached;
      root.classList.add('pulling');
      // Under the finger nothing eases, so the springback's own transition has to be off
      // again before the lean is written — the same handover toy() makes for the drag.
      root.classList.remove('homing');
      root.style.setProperty('--pull', (PULL_TRAVEL * reached).toFixed(2) + 'px');
      // A touch of shrink with it, so the bubble reads as being drawn out of the
      // cutout under tension rather than simply sliding down the screen.
      root.style.setProperty('--pull-scale', (1 - 0.03 * reached).toFixed(3));
      // The glass and the goo are mirrored off the bubble, and the bubble is now
      // travelling far enough that a mirror standing still is a pane left behind at
      // the cutout. Short, because the next move re-stirs it.
      stirLiquid(160);
      return;
    }
    // The drag starts where the hold gives up and not a pixel sooner. It used to
    // begin at three pixels of travel — a quarter of the wander a resting finger
    // makes in a third of a second — so a hold was regularly cancelled by its own
    // drag before it ever reached the haptic. The slop is taken off the travel, so
    // the swap still starts from nothing once it does begin.
    const committed = Math.abs(sideways) - HOLD_SLOP;
    if (state !== 'active' && CLOSED.has(size) && committed > 0 &&
        (dragging || Math.abs(verticalTravel) < 30)) {
      if (dragSwap(Math.sign(sideways) * committed)) {
        hasSwiped = true;
        hasMoved = true;
        return;
      }
    }
    if (verticalTravel < -24 && horizontalTravel < 40) {
      hasMoved = true;
      // The one gesture the hold does not get to run underneath: this one has already
      // acted, and there is nothing left to hold.
      endHold();
      bridge.triggerHaptic('dismiss');
      bridge.onSwipeDismiss();
      toClosed();
      return;
    }
  }, { passive: true });

  /**
   * The bubble lets go of the finger and eases back to where it rests — or, if the
   * finger had all but asked already, finishes the ask itself. A flick can lift
   * between two frames, and a gesture that was visibly most of the way there and did
   * nothing is the same bug as one that needs aiming.
   */
  function endPull(settle, threshold) {
    if (!root.classList.contains('pulling')) return;
    const asked = settle && pullReach > (threshold || PULL_SETTLE);
    pullReach = 0;
    root.classList.remove('pulling');
    // The lean lives inside `transform`, which is the per-frame property and has no
    // duration of its own — that is the whole point of the split, and it is why letting
    // go of a pull put the bubble back at the cutout in one frame. The way home is the
    // play drag's, because it is the same journey: `homing` is the one rule that gives
    // `transform` a transition, and it is named here rather than a second curve being
    // written for the pull alone.
    root.classList.add('homing');
    root.style.removeProperty('--pull');
    root.style.removeProperty('--pull-scale');
    // The glass and the goo are mirrored off the bubble, so they have to ride the
    // springback home rather than snapping back the frame the class came off.
    stirLiquid(600);
    if (asked) {
      // The tap that follows a touchend is not this gesture asking twice — it would
      // close what the pull has just opened.
      hasMoved = true;
      bridge.triggerHaptic('expand');
      openHistory();
    }
  }

  pill.addEventListener('touchend', () => {
    releaseSwap();
    endPull(true);
    endHold();
    untoy(root, '--drag');
  }, { passive: true });
  /**
   * Growing the window to make room for the scaled bubble pulls the surface out from
   * under the finger, and the system answers that with a cancel — the hold was being
   * broken by its own animation, which is why it had to be retried. A cancel that
   * arrives once that growth has happened is ours, not the user's, and the hold runs
   * on: it still has a touchend or the 350ms timer to finish it.
   */
  pill.addEventListener('touchcancel', () => {
    releaseSwap();
    endPull(true, PULL_STOLEN);
    untoy(root, '--drag');
    if (state === 'haptic' && hasGrown) return;
    endHold();
  }, { passive: true });

  pill.addEventListener('click', () => {
    if (hasMoved || hasHeld) return;

    // Open closes on any tap, its own included.
    if (state === 'active') {
      bridge.triggerHaptic('tap');
      toClosed();
      return;
    }

    if (state === 'alert') {
      clearTimeout(dwellTimer);
      // A photo opens to its full shape first; anything else has already said
      // everything it has to say, so the tap goes straight to the app.
      if (pill.classList.contains('with-image') && size !== 'picture') {
        bridge.triggerHaptic('expand');
        openPicture();
        return;
      }
      openCurrent();
      return;
    }

    // Closed. What a tap opens depends on which mod owns the closed bubble: the song
    // if one is playing, and on the bare bubble the list — the thing a bubble with
    // nothing to say is most often being asked for.
    state = 'active';
    bridge.triggerHaptic('expand');
    // Whichever mod owns the closed bubble owns the tap on it — the head of the
    // order, not whichever mod would rank first: a swipe can have handed the bubble
    // to the other one, and it used to open the neighbour's content instead.
    const owner = liveMods()[0];
    if (owner === 'timer') {
      openTimer();
      return;
    }
    if (owner === 'media') {
      openPlayer();
      return;
    }
    // A call has no panel of its own — everything worth doing to one is in Discord.
    // So the tap leaves for it, through the notification's own intent, which lands in
    // the call rather than on whatever tab Discord was last left on.
    if (owner === 'call' && call && call.key) {
      bridge.openNotification(call.key);
      toClosed();
      return;
    }
    openHistory();
  });

  /**
   * A tap anywhere else on the screen closes the bubble. It cannot come from a DOM
   * listener — the host window is only as big as the bubble — so it is the window
   * manager's ACTION_OUTSIDE, which reports the touch without swallowing it.
   */
  window.onOutsideTap = (x, y) => {
    // Every proxy reports a touch outside *its own* bounds, and there is more than one
    // proxy — so a tap on an open panel is an outside tap as far as the Now bubble's
    // proxy is concerned. Closing on it shut the panel on the way down, and the tap's
    // own click then landed on the bubble that had taken its place and opened it again:
    // a tap on an open bubble replayed the opening instead of closing it, and a hold on
    // one never got the chance to start because the panel was gone before the finger
    // had been down a tenth of a second. The point is hit-tested here rather than in
    // Kotlin, because the page is the only side that knows where anything is.
    const hit = document.elementFromPoint(x, y);
    if (hit && (pill.contains(hit) || nowPill.contains(hit))) return;
    if (state === 'active') toClosed();
    // The Now bubble's panel closes on the same tap, and for the same reason: it is
    // one page now, so one message closes whatever on it is open.
    if (nowOpen) closeNowPanel();
  };

  // #endregion ────────────────────────────────────────────────────────────────
  // #region ── the Now bubble ─────────────────────────────────────────────────

  /**
   * The torch's bubble, out by the clock. It was a page in a window of its own until
   * the canvas made one surface of the whole bar; everything here is that page, moved
   * across so that this bubble is in the same goo layer as the rest of the row and
   * can therefore actually merge with it. Nothing that used to be a message to the
   * host is one any more — the width the bubble gives up for it, and which of the two
   * stands in front, are now this page talking to itself.
   */
  const nowPill = document.getElementById('now');
  const nowGlyph = document.getElementById('now-glyph');
  const nowReading = document.getElementById('now-reading');
  const nowSlider = document.getElementById('now-slider');
  const nowRail = document.getElementById('now-rail');
  const nowFlow = document.getElementById('now-flow');
  const nowFaces = {
    closed: document.getElementById('now-closed'),
    panel: document.getElementById('now-panel'),
  };

  /** A beam rather than a bulb: a cone says the light is pointed somewhere. */
  nowGlyph.innerHTML =
    '<svg viewBox="0 0 24 24"><path d="M8.4 2h7.2a1 1 0 0 1 .97 1.24l-.9 3.6a1 1 0 0 1-.97.76H9.3a1 1 0 0 1-.97-.76l-.9-3.6A1 1 0 0 1 8.4 2zm1.1 7.6h5a1 1 0 0 1 1 1V21a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1V10.6a1 1 0 0 1 1-1zm1.5 3.4a1 1 0 0 0 0 2h2a1 1 0 0 0 0-2z"/></svg>';

  /** Kept in step with the CSS above: five slots and four gaps. */
  const NOW_SLOT = 40;
  const NOW_SLOT_GAP = 14;
  // The slot's size is a layout the script owns — it places every slot along the rail
  // from this number — so the CSS is given it rather than holding a second copy.
  root.style.setProperty('--now-slot', NOW_SLOT + 'px');
  const NOW_PANEL = { width: 300, height: 132, ms: 420 };
  // The CSS is told the panel's size rather than repeating it: this is the number the
  // host is given for the glass and for the proxy, and three copies of it is three
  // chances to move one and not the others.
  root.style.setProperty('--now-panel-width', NOW_PANEL.width + 'px');
  root.style.setProperty('--now-panel-height', NOW_PANEL.height + 'px');

  /**
   * How wide the pill rests, mirroring RESTING_WIDTH in BubbleService. Not the closed
   * bubble's width: this pill's whole job is to stand on top of One UI's own
   * flashlight chip, and that chip is wider than the bubble. Matched to the bubble
   * instead, Samsung's blue pill was left sticking out past its right edge.
   */
  /**
   * The narrowest the light is ever drawn: enough to cover One UI's own flashlight chip,
   * which is the thing it is standing on. Measured off that chip and nothing else — if a
   * One UI update makes theirs wider, theirs shows past the end of ours and this is the
   * number to move. It is a floor and not a width: with a mod on the row the light
   * reaches further, up to the row's own edge.
   */
  const NOW_RESTING = 116;
  /**
   * The gap the Now bubble leaves between itself and the bubble at the hole. Read it
   * against meltBy(): the melt is MELT_MAX less half the gap, and two shapes run together
   * at about twice the melt, so four pixels apart is a bridge of eight — the pair stands
   * there permanently necked, which is the merge being visible at rest without the two
   * of them reading as one welded pill.
   */
  const NOW_REACH = 4;
  /**
   * The narrowest it may stand at. One UI's clock is under its left half and its chip
   * under the right, and a pill that closes to less than this hands back a piece of the
   * bar it is there to be instead of. Only the flight home goes below it, and by then it
   * is a drop and on its way out.
   */
  const NOW_COVER = 128;

  /** Where its left edge rests, told by the host, which is the side that measures. */
  let nowLeft = 53;

  /**
   * The flight out and the flight home, the share of the way at which the pill is
   * actually against its stop — the split curve overshoots and settles back, so that
   * is under halfway and not the end — and the opening out that hitting it causes.
   */
  const NOW_TRAVEL = 420;
  /* Longer than the flight out, on purpose. Going out, the drop separating from the
     bubble is the whole of what there is to see and it is over the moment the pill
     hits its stop; coming home it is the last stretch that matters — the two shapes
     necking and running together — and at the outward speed that stretch was three
     frames and the light was simply gone. */
  const NOW_RETURN = 560;
  const NOW_LAND = 0.42;
  const NOW_EXPAND = 300;
  /**
   * The share of the flight after which the pill is clear of the bubble at the cutout.
   * That is when the bubble pulls its width in, not when the light came on: one drop
   * leaves, the other closes behind it.
   */
  const NOW_CLEAR = 0.2;
  /** The width given back before the pill is allowed to leave its spot. */
  const NOW_COLLAPSE = 260;

  let torch = null;
  let nowOpen = false;
  let nowDot = null;
  let nowDotAt = 0;
  let nowSliding = false;
  let nowWidth = 46;

  /** One flight is a run of steps, and a second light cancels the first outright. */
  let nowTimers = [];
  function nowAfter(milliseconds, step) {
    nowTimers.push(setTimeout(step, milliseconds));
  }
  function stopNowFlight() {
    nowTimers.forEach(clearTimeout);
    nowTimers = [];
    // A light switched back on while its drop was falling home is not being taken in
    // any more, and the bubble must not go on being told it is.
    releaseCatch(nowPill);
  }

  function showNowFace(name) {
    for (const [key, face] of Object.entries(nowFaces)) {
      face.classList.toggle('showing', key === name);
    }
  }

  /**
   * How wide the Now bubble stands once it has arrived: as far as the row's own left
   * edge, less the gap the skin needs to neck across. The row moves aside for it
   * (rowShift) and it takes what the row gave up, so the two grow and shrink against
   * each other and the neck between them holds.
   */
  function nowResting() {
    return Math.max(NOW_RESTING, NOW_COVER, rowLeftEdge() - nowLeft - NOW_REACH);
  }

  /**
   * The Now bubble taking whatever the row has left it. Called from the row's own paint
   * rather than worked out once on arrival, because the edge it grows up to moves: a
   * mod arriving pushes the row further right and this fills the gap that opens behind
   * it. Nothing here while it is flying or open — the flight owns the width on the way
   * out, and the panel is a size of its own.
   */
  function fitNowWidth() {
    if (nowPill.classList.contains('lit') && !nowOpen &&
        !root.classList.contains('now-flying')) {
      const next = nowResting();
      if (Math.abs(next - nowWidth) >= 1) {
        setNowWidth(next, NOW_EXPAND, 'var(--ease-split)');
        fitNowProxy();
      }
    }
    // Always, even when the width did not move — the width not moving is exactly the
    // case this is for.
    fitNowCrowd();
  }

  /** The least bar left between the light's glyph and its reading once it is crowded. */
  const NOW_READ_GAP = 8;
  /** How far the reading currently stands off its own edge, so the room can be read back. */
  let nowCrowd = 0;

  /**
   * The reading giving way to the row. Once the light has shrunk to NOW_COVER it cannot
   * give up any more width — below that it hands back the piece of bar it exists to
   * stand on — so the row goes on coming and the two bubbles' contents are what meet.
   * The reading is pushed left by exactly as much of it as the row has taken, which is
   * what one body of liquid does when another arrives beside it: it does not stay put
   * and get sat on, and it does not vanish.
   *
   * Bounded by the glyph, which does not move — the glyph is the left inset in every
   * bubble here and the one thing on this bar that is always in the same place.
   */
  function fitNowCrowd() {
    const idle = !nowPill.classList.contains('lit') || nowOpen ||
      root.classList.contains('now-flying');
    const taken = idle ? 0 : (nowLeft + nowWidth + NOW_REACH) - rowLeftEdge();
    // Read back through the push already applied, or the room shrinks every time this
    // runs and the reading walks itself into the glyph one paint at a time.
    const room = idle ? 0 : nowReading.getBoundingClientRect().left + nowCrowd -
      nowGlyph.getBoundingClientRect().right - NOW_READ_GAP;
    const next = Math.min(Math.max(0, taken), Math.max(0, room));
    if (Math.abs(next - nowCrowd) < 0.5) return;
    nowCrowd = next;
    root.style.setProperty('--now-crowd', next.toFixed(1) + 'px');
    stirLiquid(NOW_EXPAND + 120);
  }

  /** Flying, the pill is a drop: as wide as it is tall, a circle. */
  function nowDrop() { return compact.height; }

  /**
   * How far the punch hole is from this spot. The page can answer this itself now
   * that it is drawn across the whole screen — it used to be told, because a window
   * the size of the pill had no idea how wide the screen was.
   */
  function nowFlight() {
    return window.innerWidth / 2 - nowDrop() / 2 - nowLeft;
  }

  function setNowFly(next, milliseconds, ease) {
    root.style.setProperty('--now-fly', next + 'px');
    root.style.setProperty('--now-fly-ms', milliseconds + 'ms');
    root.style.setProperty('--now-fly-ease', ease);
    // Nothing about the glass is said here any more. This bubble's pane is mirrored
    // off the pill itself every frame like every other one, so the flight only has to
    // keep the mirror running for as long as it lasts.
    stirLiquid(milliseconds + 120);
  }

  function setNowWidth(next, milliseconds, ease) {
    nowWidth = next;
    root.style.setProperty('--now-width', next + 'px');
    root.style.setProperty('--now-width-ms', milliseconds + 'ms');
    root.style.setProperty('--now-width-ease', ease);
    stirLiquid(milliseconds + 120);
  }

  /** The proxy is exactly what can be touched, and nothing else on this bar can. */
  function fitNowProxy() {
    if (!nowPill.classList.contains('lit')) {
      bridge.setNowProxy(0, 0, 0);
      return;
    }
    if (nowOpen) {
      bridge.setNowProxy(
        NOW_PANEL.width, NOW_PANEL.height, Math.round(nowLeft + nowPanelShift())
      );
      return;
    }
    bridge.setNowProxy(Math.round(nowWidth), compact.height, Math.round(nowLeft));
  }

  function paintNowReading() {
    nowReading.textContent = torch && torch.dimmable ? torch.step + '/' + torch.steps : '';
  }

  /**
   * The light coming on. The pill is born a small drop in the true middle of the
   * screen — inside the punch hole, inside the bubble drawn around it — and thrown out
   * along the bar to its spot. It hits that spot, the bubble at the cutout closes up
   * behind it, and the pill opens out to the right off the stop it ran into. The width
   * is the consequence; the arrival is the cause.
   *
   * Both shapes are in one goo layer now, so the drop genuinely separates from the
   * bubble on the way out and is genuinely taken back into it on the way home. That is
   * the thing two windows could never do, and the reason this page is the way it is.
   */
  function lightNow() {
    traceEvent('torch on');
    stopNowFlight();
    paintNowReading();
    root.classList.add('now-flying');
    setNowWidth(nowDrop(), 0, 'linear');
    setNowFly(nowFlight(), 0, 'linear');
    // Born at the hole and no bigger than it, then let go on the next frame — the
    // starting point has to be a frame the browser has actually drawn, or there is
    // nothing to move away from.
    root.style.setProperty('--now-pop', 0.5);
    void nowPill.offsetWidth;
    requestAnimationFrame(() => {
      nowPill.classList.add('lit');
      root.style.setProperty('--now-pop', 1);
      setNowFly(0, NOW_TRAVEL, 'var(--ease-split)');
      fitNowProxy();
    });
    nowAfter(NOW_TRAVEL * NOW_CLEAR, () => window.onTorchChip(true));
    nowAfter(NOW_TRAVEL * NOW_LAND, () => {
      setNowWidth(nowResting(), NOW_EXPAND, 'var(--ease-split)');
      // The knock of hitting the stop, which is also what opens the pill out.
      bridge.triggerHaptic('tap');
    });
    // The reading is the last thing in: it belongs to width, and until the pill has
    // finished opening out there is no width for it to belong to.
    nowAfter(NOW_TRAVEL * NOW_LAND + NOW_EXPAND, () => {
      root.classList.remove('now-flying');
      fitNowProxy();
    });
  }

  /**
   * The light going out, the same journey backwards. The pill gives its width back
   * first, then leaves its spot and falls home into the punch hole, and the bubble
   * there opens up again as it arrives — because it is the thing arriving.
   */
  function douseNow() {
    traceEvent('torch off');
    stopNowFlight();
    if (nowOpen) closeNowPanel();
    // First, before the width goes: the reading belongs to width the pill is about to
    // give back, and left on it was squeezed into the drop and carried home in place of
    // the glyph — which is the one thing that has to survive the journey, because it is
    // what the whole flight is about.
    root.classList.add('now-flying');
    setNowWidth(nowDrop(), NOW_COLLAPSE, 'var(--ease-split)');
    nowAfter(NOW_COLLAPSE * 0.35, () => {
      root.style.setProperty('--now-pop', 0.5);
      // The glyph leaves first and the pill is pulled after it, the same way the glyph
      // is what arrives and the width only follows. It is the thing with the meaning
      // in it, so it is the thing with the momentum.
      nowGlyph.classList.remove('dragging');
      void nowGlyph.offsetWidth;
      root.style.setProperty('--now-drag-ms', NOW_RETURN + 'ms');
      nowGlyph.classList.add('dragging');
      setNowFly(nowFlight(), NOW_RETURN, 'var(--ease-grow)');
      // `lit` stays on for the whole way home, and that is the point: it is what the
      // skin reads to decide this bubble is one of the shapes in the row, so taking it
      // off at the start of the return — which is what it used to do — meant the drop
      // spent the entire journey outside the liquid and arrived at the bubble as a
      // separate object that simply faded out on top of it. It goes out on arrival
      // instead, and it does not fade on the way: a drop coming home is absorbed, and
      // a half-transparent shape is erased by the alpha contrast rather than merged.
      fitNowProxy();
      // The bubble at the cutout opens up as the drop falls back into it.
      // At the start of the return and not part-way through it. The row is not waiting
      // for the drop to arrive — the bar is free the moment the light leaves its spot —
      // and anything else reads as the bubbles hanging back before remembering to move.
      window.onTorchChip(false);
      // And the bubble takes the drop the same way it takes a circle: as a merge it
      // measures rather than a bounce it plays. The stretch grows with however much of
      // the drop is inside it — liquid added to a drop of water jumps its tension and
      // contains itself again — and the light only goes out once the drop is deep
      // enough inside that nothing is seen going out.
      catchInto(nowPill, pill, {
        swallowed: () => {
          // Home, dark, and put back on its spot ready to be thrown out again. It goes
          // out on the spot rather than fading, because by now it is inside the bubble
          // and there is nothing left to see it happen against.
          root.style.setProperty('--now-fade-ms', '0ms');
          nowPill.classList.remove('lit');
          nowGlyph.classList.remove('dragging');
          setNowFly(0, 0, 'linear');
          fitNowProxy();
          // Taking `lit` off is what takes the glass off with it: an unlit Now bubble is
          // not one of the shapes the mirror measures, so its pane is sent as nothing and
          // the host clears it — a transparent view otherwise goes on blurring.
          requestAnimationFrame(() => root.style.removeProperty('--now-fade-ms'));
        },
      });
    });
  }

  function nowSlotX(index) {
    return index * (NOW_SLOT + NOW_SLOT_GAP) + NOW_SLOT / 2;
  }

  function buildNowSlider() {
    const count = torch && torch.dimmable ? torch.steps : 1;
    if (nowFlow.children.length === count + 1) return;
    nowRail.textContent = '';
    nowFlow.textContent = '';
    for (let index = 0; index < count; index += 1) {
      for (const layer of [nowRail, nowFlow]) {
        const slot = document.createElement('div');
        slot.className = 'now-slot';
        slot.style.left = nowSlotX(index) + 'px';
        layer.appendChild(slot);
      }
    }
    nowDot = document.createElement('div');
    nowDot.className = 'now-dot';
    nowFlow.appendChild(nowDot);
    nowSlider.style.width =
      (count * NOW_SLOT + (count - 1) * NOW_SLOT_GAP) + 'px';
  }

  /**
   * The dot where it is, and every step swollen by how near the dot is to it. A step
   * the dot has reached is full size; one a whole step away is nothing at all; in
   * between, both are part-grown and the blur bridges them — which is the liquid.
   */
  function paintNowSlider() {
    if (!nowDot) return;
    nowDot.style.left = nowSlotX(nowDotAt) + 'px';
    Array.from(nowFlow.querySelectorAll('.now-slot')).forEach((slot, index) => {
      slot.style.setProperty('--near', Math.max(0, 1 - Math.abs(nowDotAt - index)));
    });
  }

  function nowSlideTo(clientX) {
    const count = nowFlow.querySelectorAll('.now-slot').length;
    const box = nowSlider.getBoundingClientRect();
    const at = (clientX - box.left - NOW_SLOT / 2) / (NOW_SLOT + NOW_SLOT_GAP);
    return Math.min(count - 1, Math.max(0, at));
  }

  nowSlider.addEventListener('touchstart', event => {
    if (!torch || !torch.dimmable) return;
    nowSliding = true;
    nowSlider.classList.add('dragging');
    nowDotAt = nowSlideTo(event.touches[0].clientX);
    paintNowSlider();
  }, { passive: true });

  nowSlider.addEventListener('touchmove', event => {
    if (!nowSliding) return;
    nowDotAt = nowSlideTo(event.touches[0].clientX);
    paintNowSlider();
  }, { passive: true });

  nowSlider.addEventListener('touchend', () => {
    if (!nowSliding) return;
    nowSliding = false;
    nowSlider.classList.remove('dragging');
    nowDotAt = Math.round(nowDotAt);
    paintNowSlider();
    bridge.setTorch(nowDotAt + 1);
    bridge.triggerHaptic('tap');
  });

  nowSlider.addEventListener('click', event => event.stopPropagation());

  /**
   * How far this bubble has to travel to stand in the middle of the screen. An open
   * bubble is centred wherever its closed one stood — the media tab does it and so
   * does every other Active state — and this one starts out by the clock, so being
   * centred is a move rather than a width. It is written as the flight offset the
   * pill already owns rather than as a second transform: one property, one owner,
   * and the way home is the same offset going back to nothing.
   */
  function nowPanelShift() {
    return window.innerWidth / 2 - NOW_PANEL.width / 2 - nowLeft;
  }

  function openNowPanel() {
    nowOpen = true;
    buildNowSlider();
    if (!nowSliding) nowDotAt = (torch ? torch.step : 1) - 1;
    paintNowSlider();
    const shift = nowPanelShift();
    root.style.setProperty('--now-fly', shift + 'px');
    root.style.setProperty('--now-fly-ms', NOW_PANEL.ms + 'ms');
    root.style.setProperty('--now-fly-ease', 'var(--ease-grow)');
    fitNowProxy();
    // The skin is mirrored off this box every frame and the loop only runs while
    // something says it is moving. A class that changes the size says nothing, so
    // without this the blob stayed at the size it had when the panel opened and the
    // shape left standing there afterwards was the panel's, not the pill's.
    stirLiquid(NOW_PANEL.ms + 120);
    // The filter's region is the layer's own box, so a shape taller than the layer is
    // cut off at its edge rather than drawn: the panel is twice the height of the row
    // it is standing in and the layer has to make room for it before it opens.
    root.style.setProperty('--liquid-tall', (NOW_PANEL.height + 24) + 'px');
    requestAnimationFrame(() => {
      nowPill.classList.add('open');
      showNowFace('panel');
    });
  }

  function closeNowPanel() {
    nowOpen = false;
    nowPill.classList.remove('open');
    showNowFace('closed');
    // Back to its spot by the clock, which paints the glass and stirs the skin on the
    // same curve — the panel was centred by this same offset on the way out.
    setNowFly(0, NOW_PANEL.ms, 'var(--ease-grow)');
    fitNowProxy();
    stirLiquid(NOW_PANEL.ms + 120);
    // Back to the row's own height once the panel has finished coming in, and not
    // before: a filter region that shrinks mid-collapse clips what is still moving.
    nowAfter(NOW_PANEL.ms + 40, () => root.style.removeProperty('--liquid-tall'));
  }

  /**
   * A tap on the open panel closes it, exactly as a tap on an open bubble does. The panel
   * is the one part of this bubble reached the ordinary way — the rail inside it is
   * dragged — so this is a listener rather than a branch in nowTouch, and the rail's own
   * handler stops the click before it gets here.
   */
  nowPill.addEventListener('click', () => {
    if (!nowOpen) return;
    bridge.triggerHaptic('tap');
    closeNowPanel();
  });

  /**
   * Whether a point on the bar belongs to this bubble.
   *
   * Its own box and nothing else — not the proxy that heard the touch, not what the DOM
   * has stacked over it. Both proxies carry a grab margin, the two bubbles rest six
   * pixels apart, and the light now reaches most of the way to the punch hole, so the
   * margins overlap and the window that hears a finger is a race. Where the finger
   * landed is not.
   */
  function nowHolds(x, y) {
    if (!nowPill.classList.contains('lit')) return false;
    const box = nowPill.getBoundingClientRect();
    return x >= box.left && x <= box.right && y >= box.top && y <= box.bottom;
  }

  /**
   * The light's own Tap and Haptic, driven straight from the forwarded stream rather
   * than from listeners on the element.
   *
   * Everything else on this page is reached by rebuilding the DOM events the browser
   * would have made and dispatching them at whatever is under the point, which is right
   * for the row: it is a dozen elements deep and every one of them has its own reason to
   * hear a finger. This bubble is one shape with two gestures, and going the long way
   * round for it meant a tap could be answered by the row instead — hit-testing, event
   * bubbling and a retargeted click are three places for that to go wrong and there was
   * nothing to gain from any of them. The panel is the exception and still gets real
   * events: the intensity rail is dragged, and that is the DOM's own to handle.
   */
  let nowHeld = false;
  let nowHoldTimer = null;
  let nowDownAt = null;

  function nowTouch(action, x, y) {
    if (action === 'down') {
      nowHeld = false;
      nowDownAt = { x, y };
      nowPill.classList.add('pressing');
      clearTimeout(nowHoldTimer);
      nowHoldTimer = setTimeout(() => {
        nowHeld = true;
        nowPill.classList.remove('pressing');
        bridge.triggerHaptic('expand');
        // There is no app behind this one to leave for — the torch is the camera
        // service and has no face of its own — so the hold opens what the bubble owns,
        // and what it adds over the tap is the growth and the buzz that say the finger
        // was heard before anything happened.
        if (!nowOpen) openNowPanel();
      }, HOLD_MILLIS);
      return;
    }
    if (action === 'move') {
      // The same wander that calls off the row's hold calls off this one.
      if (nowDownAt && Math.hypot(x - nowDownAt.x, y - nowDownAt.y) > PROXY_TAP_SLOP) {
        clearTimeout(nowHoldTimer);
        nowPill.classList.remove('pressing');
      }
      return;
    }
    clearTimeout(nowHoldTimer);
    nowPill.classList.remove('pressing');
    const travelled = nowDownAt ? Math.hypot(x - nowDownAt.x, y - nowDownAt.y) : Infinity;
    nowDownAt = null;
    if (action !== 'up' || nowHeld || travelled >= PROXY_TAP_SLOP) return;
    bridge.triggerHaptic('expand');
    if (nowOpen) closeNowPanel();
    else openNowPanel();
  }

  /** Where its left edge rests: the host measures it off One UI's own chip. */
  window.setNowLeft = value => {
    nowLeft = value;
    root.style.setProperty('--now-left', value + 'px');
  };

  window.onTorchUpdate = payload => {
    const wasLit = Boolean(torch);
    torch = payload;
    if (torch && !wasLit) lightNow();
    else if (!torch && wasLit) douseNow();
    else if (torch) {
      paintNowReading();
      if (nowOpen && !nowSliding) {
        nowDotAt = torch.step - 1;
        buildNowSlider();
        paintNowSlider();
      }
    }
  };

  // #endregion ────────────────────────────────────────────────────────────────
  // #region ── forwarded touch ────────────────────────────────────────────────

  /**
   * The window this page is drawn in takes no touches at all — it spans the whole
   * status bar so that every bubble is on one surface and can merge with the others,
   * and a touchable window that wide would leave nowhere for the shade swipe to start.
   * The finger lands on a small proxy window instead, and the host forwards where it
   * was touched.
   *
   * Nothing below reimplements a gesture. It rebuilds the events the DOM would have
   * produced and dispatches them at whatever is under the point, so every listener on
   * this page — the pill's own drag, a history row's swipe, a button's click — keeps
   * working without knowing the touch came the long way round.
   */
  let proxyTarget = null;
  let proxyDown = null;
  let proxySource = 'main';
  /** True for the whole of a touch the Now bubble answered on its own. */
  let nowOwnsTouch = false;
  /** Far enough that the release is a drag's end rather than a tap. Mirrors HOLD_SLOP. */
  const PROXY_TAP_SLOP = 22;

  /** An element, short enough to read off a debug line. */
  function describe(element) {
    if (!element) return 'nothing';
    return (element.id || element.className || element.tagName) +
      (pill.contains(element) ? ' (in the bubble)' : '') +
      (nowPill.contains(element) ? ' (in the light)' : '');
  }

  function proxyEvent(type, target, x, y, isEnd) {
    const touch = new Touch({ identifier: 1, target, clientX: x, clientY: y, pageX: x, pageY: y });
    target.dispatchEvent(new TouchEvent(type, {
      touches: isEnd ? [] : [touch],
      targetTouches: isEnd ? [] : [touch],
      changedTouches: [touch],
      bubbles: true,
      cancelable: true,
    }));
  }

  /**
   * What a touch from this proxy is allowed to land on. A proxy is placed over one
   * bubble and nothing else, so a touch it heard belongs to that bubble however the
   * page happens to be stacked at that moment — a grown panel is drawn across most of
   * the bar and sits above the Now bubble in the DOM, so without this every tap and
   * every hold aimed at the light was answered by whatever mod owned the main bubble.
   */
  function proxyPoint(x, y, source) {
    const hit = document.elementFromPoint(x, y);
    // Where it landed decides, not which window heard it and not what is stacked over
    // it. The two proxies each carry a grab margin and the two bubbles now stand a few
    // pixels apart, so their margins lie over each other: a touch on the light was
    // being answered by the main bubble whenever the main proxy heard it first, and a
    // touch on the main bubble's left edge was being eaten by the light whenever the
    // Now proxy did. The one thing neither window knows is where the shapes are.
    // The closed light never gets here — it answers its own touches, see nowTouch. This
    // is the open panel, which is drawn across the bar and above everything on it: a
    // touch inside it is the panel's whatever the DOM has stacked where the finger fell.
    if (!nowOpen || !nowHolds(x, y)) return hit;
    return hit && nowPill.contains(hit) ? hit : nowPill;
  }

  window.onProxyTouch = (action, x, y, source) => {
    if (action !== 'move') {
      const box = nowPill.getBoundingClientRect();
      bridge.note(
        'page: ' + action + ' at ' + Math.round(x) + ', ' + Math.round(y) +
        ' — the light is ' + (nowPill.classList.contains('lit') ? 'lit' : 'dark') +
        ' at ' + Math.round(box.left) + '–' + Math.round(box.right) +
        ', ' + Math.round(box.top) + '–' + Math.round(box.bottom) +
        ' — owner ' + (nowHolds(x, y) && !nowOpen ? 'the light' : 'the row') +
        ' — under it ' + describe(document.elementFromPoint(x, y))
      );
    }
    // The light first, and by geometry alone. Its panel is the exception: the rail in
    // there is dragged, so once it is open the touches go the ordinary way and reach the
    // elements that know what to do with them.
    // A touch this window heard is this bubble's, whatever the coordinates work out to:
    // the window is placed over the light and over nothing else, which is the same thing
    // that made this simple when the light was a page in a window of its own. The row's
    // window can hear one too — the two stand six pixels apart — and that one is decided
    // by where it landed, which is all the row's window can tell us.
    if (action === 'down') {
      nowOwnsTouch = !nowOpen &&
        (source === 'now' || (nowHolds(x, y) && CLOSED.has(size)));
    }
    if (nowOwnsTouch) {
      nowTouch(action, x, y);
      if (action === 'up' || action === 'cancel') nowOwnsTouch = false;
      return;
    }
    if (action === 'down') {
      // Everything after a down goes to the element the down landed on, exactly as a
      // real touch stream does: a finger that slides off a row still belongs to it.
      proxySource = source;
      proxyTarget = proxyPoint(x, y, source);
      proxyDown = { x, y };
      if (proxyTarget) proxyEvent('touchstart', proxyTarget, x, y, false);
      return;
    }
    if (!proxyTarget) return;
    if (action === 'move') {
      proxyEvent('touchmove', proxyTarget, x, y, false);
      return;
    }
    proxyEvent(action === 'up' ? 'touchend' : 'touchcancel', proxyTarget, x, y, true);
    // A real touch that did not travel is followed by a click, and half this page is
    // listening for one. It is sent to what is under the finger *now* rather than to
    // the down's target, because a panel that opened under the release did not get
    // the down and would otherwise never be clickable.
    const travelled = proxyDown
      ? Math.hypot(x - proxyDown.x, y - proxyDown.y)
      : Infinity;
    if (action === 'up' && travelled < PROXY_TAP_SLOP) {
      const released = proxyPoint(x, y, proxySource) || proxyTarget;
      released.dispatchEvent(new MouseEvent('click', {
        clientX: x, clientY: y, bubbles: true, cancelable: true,
      }));
    }
    proxyTarget = null;
    proxyDown = null;
  };

  // #endregion ────────────────────────────────────────────────────────────────

  window.onNotificationUpdate = show;
  window.setUnreadCount = count => {
    const badge = document.getElementById('unread');
    badge.textContent = count > 9 ? '9+' : String(count);
    badge.classList.toggle('present', count > 0);
  };
  window.setPillBackground = rgba => {
    root.style.setProperty('--pill-background', rgba);
    // Split for the skin: solid colour on the shapes, transparency on the layer.
    const parts = (String(rgba).match(/[\d.]+/g) || []).map(Number);
    if (parts.length < 3) return;
    root.style.setProperty('--pill-solid', 'rgb(' + parts.slice(0, 3).join(',') + ')');
    root.style.setProperty('--pill-alpha', parts.length > 3 ? String(parts[3]) : '1');
    stirLiquid(120);
  };
  window.setCompactSize = (width, height) => {
    compact = { width, height };
    document.documentElement.style.setProperty('--pill-width', width + 'px');
    document.documentElement.style.setProperty('--pill-height', height + 'px');
    // A closed mod sizes its window from the bubble's own width, so a bubble that
    // changes size under one has to hand it the new room.
    if (size === 'timing') setSize('timing', timerWindow(), true);
    else if (size === 'playing') setSize('playing', mediaWindow(), true);
    else { paintSatellites(); paintShift(); }
  };
  window.setGrab = value =>
    document.documentElement.style.setProperty('--grab', value + 'px');
  window.setNotificationIdentity = value => { pill.dataset.identity = String(value); };
  window.setMicrophoneActive = isActive =>
    document.getElementById('microphone-dot').classList.toggle('active', isActive);
  window.setCameraActive = isActive =>
    document.getElementById('camera-dot').classList.toggle('active', isActive);

  bridge.ready();
</script>
